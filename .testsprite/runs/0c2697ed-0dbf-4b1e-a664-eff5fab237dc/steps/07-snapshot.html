/* ============================================================================
   Tasks workflow — full-surface polish layer
   Extends the agenda hero / search / task-section language into every
   remaining Tasks surface: rows, chips, menus, modals, confirmations,
   the unfinished-work flyout, and the historical read-only state.
   Anchored menus render through a portal at the document root, so their
   stacking context is the page itself (above modal scrim, below toasts).
   ========================================================================== */

.anchored-menu {
  position: fixed;
  display: block;
  z-index: 90;
  box-shadow: 0 16px 44px rgba(18, 27, 17, 0.16), 0 2px 8px rgba(18, 27, 17, 0.08);
}

.anchored-menu > button[role="menuitem"] {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: flex-start;
  text-align: left;
}

.anchored-menu > button[role="menuitem"] svg + svg {
  margin-left: auto;
}

.anchored-menu > button[role="menuitem"] svg:last-child {
  margin-left: 0;
}

.move-target-menu.anchored-menu {
  width: 240px;
  max-height: 260px;
  overflow: auto;
}

.move-target-menu > span {
  padding: 6px 8px 4px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.move-target-menu > p {
  padding: 6px 8px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
}

/* Composer clearance: the sticky dock must never cover the last task row. */
.tasks-workspace {
  padding-bottom: 176px;
}

@media (max-width: 780px) {
  .tasks-workspace {
    padding-bottom: 196px;
  }
}

/* Task rows — hover, focus, selected, completed, dense */
.workspace-task {
  border-radius: 12px;
  cursor: pointer;
}

.workspace-task:hover {
  background: #f6f7f1;
}

.workspace-task:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(124, 201, 54, 0.24);
}

.workspace-task.is-surfaced {
  background: #f3f8ea;
  box-shadow: inset 2px 0 0 var(--signal-strong);
}

.workspace-task.is-completed h3,
.workspace-task.is-completed p {
  color: var(--muted);
}

.workspace-task.is-completed h3 {
  text-decoration: line-through;
  text-decoration-color: rgba(98, 106, 97, 0.5);
  text-decoration-thickness: 1px;
}

.workspace-task small {
  display: block;
  max-width: 720px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Sync provenance chips — quiet, semantic, never color-only */
.sync-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 8px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.05em;
  vertical-align: 1px;
}

.sync-chip::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}

.sync-chip.synced {
  background: var(--signal-wash, #e6f7d5);
  color: #557d35;
}

.sync-chip.awaiting {
  background: #edf4ff;
  color: #3974d8;
}

.sync-chip.degraded {
  background: #fff8e8;
  color: #9b6611;
}

/* Historical read-only state */
.task-readonly-banner {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 11px 14px;
  border: 1px solid #c9d8f2;
  border-radius: 11px;
  background: #edf4ff;
}

.task-readonly-banner strong {
  flex: 0 0 auto;
  color: #2c5aa8;
  font-size: 10px;
  font-weight: 780;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.task-readonly-banner span {
  color: #45618f;
  font-size: 10px;
  line-height: 1.45;
}

/* Details modal: provenance footer + subtask states */
.task-detail-modal > footer.task-detail-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 15px 26px;
  border-top: 1px solid var(--line);
  background: #f2f1e9;
}

.task-detail-footer small {
  color: var(--muted);
  font-size: 9px;
}

.subtask-list article.completed strong {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: rgba(98, 106, 97, 0.45);
  text-decoration-thickness: 1px;
}

.subtask-count-ring {
  min-width: 40px;
  height: 22px;
  display: inline-grid;
  place-items: center;
  padding: 0 8px;
  border-radius: 999px;
  background: #e8e7df;
  color: #5d6158;
  font-size: 9px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
}

.task-loading {
  padding: 26px 0;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

/* Confirmations: reversible archive vs. permanent delete are visually
   separated — archive stays neutral green, delete alone is red. */
.delete-confirmation {
  width: min(460px, 100%);
  padding: 26px 26px 22px;
  border-radius: 18px;
  background: #f7f5ed;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.38);
  display: grid;
  gap: 12px;
  justify-items: start;
}

.delete-confirmation > span {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: #f8ded8;
  color: #a03324;
}

.delete-confirmation.reversible > span {
  background: var(--signal-wash, #e6f7d5);
  color: #557d35;
}

.delete-confirmation h2 {
  margin: 0;
  font: 650 19px/1.25 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: -0.02em;
}

.delete-confirmation p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.55;
}

.delete-confirmation p strong {
  color: var(--ink);
}

.delete-confirmation > div {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  width: 100%;
  margin-top: 6px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.delete-confirmation .confirm-delete {
  border: 1px solid #c4574a;
  border-radius: 9px;
  background: #d4493f;
  color: #fff;
  min-height: 38px;
  padding: 0 14px;
  font-weight: 720;
}

.delete-confirmation .confirm-delete:hover {
  background: #c13f36;
}

.delete-confirmation .confirm-archive {
  border: 1px solid #9acb60;
  border-radius: 9px;
  background: #b4f76c;
  color: #2f4718;
  min-height: 38px;
  padding: 0 14px;
  font-weight: 720;
}

.delete-confirmation .confirm-archive:hover {
  background: #a5ef58;
}

.delete-confirmation > div > button:not(.confirm-delete):not(.confirm-archive) {
  min-height: 38px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: transparent;
}

/* Unfinished-work flyout — same language as the agenda hero */
.carry-flyout {
  display: flex;
  flex-direction: column;
  background: #fbfcf8;
  padding: 0;
}

.carry-flyout > header {
  padding: 24px 24px 18px;
  border-bottom: 1px solid var(--line);
}

.carry-flyout > header span {
  color: #8d6b27;
  font-size: 9px;
  font-weight: 780;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.carry-flyout > header h2 {
  margin: 6px 0 0;
  font: 650 22px/1.2 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: -0.03em;
}

.carry-flyout > header small {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.5;
}

.carry-flyout > header button {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #f4f3ec;
}

.carry-flyout > div {
  flex: 1;
  overflow: auto;
  padding: 6px 24px 18px;
}

.carry-flyout > div > section {
  padding: 14px 0 4px;
}

.carry-flyout > div > section + section {
  border-top: 1px solid var(--line);
}

.carry-flyout h3 {
  margin: 0 0 4px;
  color: #5d6158;
  font: 700 10px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.carry-flyout article {
  display: grid;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #e7e6de;
  background: transparent;
  border-radius: 0;
}

.carry-flyout article:last-child {
  border-bottom: 0;
}

.carry-row-copy {
  display: grid;
  gap: 3px;
}

.carry-row-copy strong {
  font-size: 12px;
  line-height: 1.35;
}

.carry-row-copy small {
  color: var(--muted);
  font-size: 9px;
}

.carry-row-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.carry-row-actions button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 32px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  padding: 0 11px;
  color: var(--ink);
  font-size: 10px;
  font-weight: 650;
  white-space: nowrap;
}

.carry-row-actions button:not(:disabled):hover {
  border-color: #b8b9af;
  background: #fffef8;
  transform: translateY(-1px);
}

.carry-row-actions button:first-child {
  border-color: #9acb60;
  background: #e9f7d3;
  color: #3c5a1e;
}

.carry-row-actions button:first-child:not(:disabled):hover {
  border-color: #86bd4f;
  background: #ddf3b8;
}

.carry-empty {
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 48px 20px;
  color: var(--muted);
  text-align: center;
}

.carry-empty svg {
  color: #7fb944;
}

.carry-empty strong {
  color: var(--ink);
  font-size: 13px;
}

.carry-empty span {
  font-size: 10px;
}

.carry-flyout > footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 24px;
  border-top: 1px solid var(--line);
  background: #f4f3ec;
}

.carry-flyout > footer small {
  color: var(--muted);
  font-size: 9px;
}

.carry-flyout > footer button {
  min-height: 34px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper);
  font-size: 10px;
  font-weight: 700;
}

/* Filter result count */
.task-filter-result {
  margin-left: 8px;
  padding: 3px 8px;
  border-radius: 999px;
  background: #e8e7df;
  color: #5d6158;
  font-size: 8px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 780px) {
  .workspace-task small {
    white-space: normal;
  }

  .sync-chip {
    margin-left: 0;
    margin-top: 4px;
  }

  .carry-row-actions button {
    flex: 1 1 auto;
    justify-content: center;
  }
}

@media (prefers-reduced-motion: reduce) {
  .anchored-menu {
    animation: none;
  }
}

/* Task rows are not a timeline: the evidence-view rail line and row dots
   leak into .task-records via the shared .evidence-list treatment. The
   state chips already carry that meaning, so remove both pseudos. */
.task-records.evidence-list::before,
.task-records .workspace-task::before,
.task-records .subtask-list article::before {
  content: none;
  display: none;
}

/* Unfinished-work flyout: a proper overlay surface. The scrim now dims AND
   blurs the entire window (rail included) with the same treatment as the
   task modals, and the panel slides in from its edge with the platform
   easing. */
.carry-flyout-backdrop {
  background: rgba(18, 20, 16, 0.5);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  animation: modalFade 0.18s ease both;
}

.carry-flyout {
  animation: carryFlyoutEnter 0.24s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  box-shadow: -18px 0 60px rgba(0, 0, 0, 0.22);
}

@keyframes carryFlyoutEnter {
  from {
    opacity: 0.4;
    transform: translateX(28px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .carry-flyout-backdrop,
  .carry-flyout {
    animation: none;
  }
}

/* Fixed-height task selection keeps bulk completion in view while the task rows
   scroll independently. The parent owns every provider write. */
.task-selection-card {
  display: flex;
  height: min(var(--task-selection-card-height, 372px), calc(100dvh - 140px));
  min-height: 280px;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface-raised);
  box-shadow: var(--shadow-card);
}

.task-selection-card-header,
.task-selection-card-footer {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
}

.task-selection-card-header {
  border-bottom: 1px solid var(--line);
  background: #f5f7f3;
}

.task-selection-card-header > div {
  display: grid;
  min-width: 0;
  flex: 1 1 auto;
  gap: 1px;
}

.task-selection-card-header span {
  color: var(--muted);
  font-size: 8px;
  font-weight: 750;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.task-selection-card-header h2 {
  margin: 0;
  overflow: hidden;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.task-selection-count {
  min-width: 0;
  flex: 0 0 auto;
  padding: 3px 8px;
  border-radius: 999px;
  background: #e8ede4;
  color: #52604e;
  font-size: 9px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  text-align: center;
  white-space: nowrap;
}

.task-selection-notice {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 7px;
  margin: 0;
  padding: 8px 16px;
  border-bottom: 1px solid #ecd7a7;
  background: #fff8e8;
  color: #76500c;
  font-size: 10px;
  line-height: 1.35;
}

.task-selection-notice svg,
.task-selection-card-footer button svg {
  flex: 0 0 auto;
}

.task-selection-scroll {
  min-height: 0;
  flex: 1 1 auto;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
}

.task-selection-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.task-selection-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  min-height: 58px;
  align-items: center;
  padding: 7px 12px;
  border-bottom: 1px solid #e5e9e1;
  transition: background 150ms ease, box-shadow 150ms ease;
}

.task-selection-row:last-child {
  border-bottom: 0;
}

.task-selection-row:hover {
  background: #f5f8f2;
}

.task-selection-row.is-overdue {
  box-shadow: inset 2px 0 0 #d4493f;
}

.task-selection-row > label {
  display: grid;
  min-width: 0;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  cursor: pointer;
}

.task-selection-row input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.task-selection-checkbox {
  display: grid;
  width: 20px;
  height: 20px;
  place-items: center;
  border: 1.5px solid #b9c2b3;
  border-radius: 6px;
  background: #fff;
  color: transparent;
  transition: background 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
}

.task-selection-row input:checked + .task-selection-checkbox {
  border-color: #7cbd38;
  background: #def1ca;
  color: #315f17;
}

.task-selection-row input:focus-visible + .task-selection-checkbox {
  outline: 3px solid rgba(124, 201, 54, 0.3);
  outline-offset: 2px;
}

.task-selection-copy {
  display: grid;
  min-width: 0;
  gap: 1px;
}

.task-selection-copy strong,
.task-selection-copy small,
.task-selection-copy em {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.task-selection-copy strong {
  font-size: 12px;
  font-weight: 650;
  line-height: 1.3;
}

.task-selection-copy small,
.task-selection-copy em {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.35;
}

.task-selection-copy em {
  font-style: normal;
}

.task-selection-state-label {
  flex: 0 0 auto;
  padding: 3px 7px;
  border-radius: 999px;
  background: #eef1eb;
  color: #687166;
  font-size: 8px;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
}

.task-selection-state-label.overdue {
  background: #f8ded8;
  color: #91392d;
}

.task-selection-loading,
.task-selection-state {
  display: grid;
  min-height: 100%;
  align-content: center;
  justify-items: center;
  gap: 7px;
  padding: 24px;
  color: var(--muted);
  text-align: center;
}

.task-selection-loading {
  align-content: start;
  padding: 12px 16px;
}

.task-selection-skeleton {
  width: 100%;
  height: 58px;
  border-radius: 9px;
  background: linear-gradient(90deg, #edf0ea 25%, #f7f8f4 42%, #edf0ea 60%);
  background-size: 200% 100%;
  animation: task-selection-shimmer 1.2s ease-in-out infinite;
}

.task-selection-state strong {
  color: var(--ink);
  font-size: 12px;
}

.task-selection-state p {
  max-width: 310px;
  margin: 0;
  font-size: 10px;
  line-height: 1.45;
}

.task-selection-state.error {
  color: #91392d;
}

.task-selection-state.error strong {
  color: #91392d;
}

.task-selection-state button {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 4px;
  padding: 0 10px;
  border: 1px solid #e1b8b2;
  border-radius: 9px;
  background: #fff5f3;
  color: #91392d;
  font-size: 10px;
  font-weight: 700;
}

.task-selection-card-footer {
  min-height: 0;
  border-top: 1px solid var(--line);
  background: #f5f7f3;
  flex-wrap: wrap;
  row-gap: 6px;
}

.task-selection-card-footer small {
  flex: 1 1 140px;
  min-width: 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.35;
}

.task-selection-card-footer button {
  flex-shrink: 0;
  max-width: 100%;
}

.task-selection-card-footer .primary {
  min-height: 32px;
  flex: 0 0 auto;
  padding: 0 12px;
  font-size: 10px;
  font-weight: 700;
}

.task-selection-card-footer .ghost {
  min-height: 32px;
  flex: 0 0 auto;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}

.task-selection-card-footer .ghost:hover {
  color: var(--ink);
  border-color: #c3ccbb;
}

/* Dense card (avatar agenda flyout): single-line header, tighter rows, and a
   slim footer so 3+ tasks stay visible inside a 220px budget. */
.task-selection-card.is-dense {
  min-height: 0;
  border-radius: 12px;
}

.task-selection-card.is-dense .task-selection-card-header {
  padding: 7px 10px;
}

.task-selection-card.is-dense .task-selection-card-header span {
  display: none;
}

.task-selection-card.is-dense .task-selection-card-header h2 {
  font-size: 12.5px;
}

.task-selection-card.is-dense .task-selection-count {
  padding: 2px 7px;
  font-size: 8.5px;
}

.task-selection-card.is-dense .task-selection-row {
  min-height: 44px;
  padding: 5px 10px;
}

.task-selection-card.is-dense .task-selection-row > label {
  grid-template-columns: 18px minmax(0, 1fr);
}

.task-selection-card.is-dense .task-selection-checkbox {
  width: 18px;
  height: 18px;
  border-radius: 6px;
}

.task-selection-card.is-dense .task-selection-checkbox svg {
  width: 12px;
  height: 12px;
}

.task-selection-card.is-dense .task-selection-copy {
  gap: 0;
}

.task-selection-card.is-dense .task-selection-copy small {
  display: none;
}

.task-selection-card.is-dense .task-selection-copy strong {
  font-size: 12px;
}

.task-selection-card.is-dense .task-selection-copy em {
  font-size: 8.5px;
}

.task-selection-card.is-dense .task-selection-state-label {
  padding: 2px 6px;
  font-size: 7.5px;
}

.task-selection-card.is-dense .task-selection-card-footer {
  flex-wrap: nowrap;
  padding: 7px 10px;
}

.task-selection-card.is-dense .task-selection-card-footer small {
  display: none;
}

.task-selection-card.is-dense.is-confirming .task-selection-card-footer small {
  display: block;
}

.task-selection-card.is-dense .task-selection-card-footer .primary,
.task-selection-card.is-dense .task-selection-card-footer .ghost {
  min-height: 32px;
  flex: 1 1 auto;
  justify-content: center;
  font-size: 11px;
}

.task-selection-card.is-dense.is-confirming .task-selection-card-footer {
  flex-wrap: wrap;
}

.task-selection-card.is-dense .task-selection-skeleton {
  height: 44px;
}

@keyframes task-selection-shimmer {
  from { background-position: 100% 0; }
  to { background-position: -100% 0; }
}

@media (max-width: 560px) {
  .task-selection-card {
    height: min(var(--task-selection-card-height, 372px), calc(100dvh - 116px));
  }

  .task-selection-card-header,
  .task-selection-card-footer,
  .task-selection-row {
    padding-inline: 12px;
  }

  .task-selection-card.is-dense .task-selection-card-header,
  .task-selection-card.is-dense .task-selection-card-footer,
  .task-selection-card.is-dense .task-selection-row {
    padding-inline: 10px;
  }

  .task-selection-row {
    grid-template-columns: minmax(0, 1fr);
  }

  .task-selection-state-label {
    display: none;
  }

  .task-selection-copy small,
  .task-selection-copy em {
    white-space: normal;
  }

  .task-selection-card.is-dense .task-selection-copy small,
  .task-selection-card.is-dense .task-selection-copy em {
    white-space: nowrap;
  }

  .task-selection-card-footer {
    align-items: stretch;
    flex-direction: column;
  }

  .task-selection-card.is-dense .task-selection-card-footer {
    flex-direction: row;
    align-items: center;
  }

  .task-selection-card.is-dense.is-confirming .task-selection-card-footer {
    flex-direction: column;
    align-items: stretch;
  }

  .task-selection-card-footer .primary {
    width: 100%;
    min-height: 40px;
  }

  .task-selection-card-footer .ghost {
    width: 100%;
    min-height: 40px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .task-selection-row,
  .task-selection-checkbox,
  .task-selection-skeleton {
    animation: none;
    transition: none;
  }
}

/* ============================================================================
   Composer dock — focus-first input upgrade
   The dock is the page's persistent primary action, so it earns the
   blueprint's focus treatment: signal ring + lift when engaged, an
   auto-growing field, a kbd send hint, and a send button that arms
   from quiet neutral to signal green.
   ========================================================================== */
.progress-input-shell {
  min-height: 56px;
  padding: 7px 8px 7px 14px;
  border-color: #ccd3c7;
  border-radius: 18px;
  background: var(--surface-raised, #fbfcf8);
  box-shadow: var(--shadow-card);
  transition: border-color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 160ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.progress-input-shell:focus-within {
  border-color: var(--signal-strong, #7cc936);
  box-shadow: var(--shadow-card), 0 0 0 3px rgba(124, 201, 54, 0.24);
  transform: translateY(-1px);
}

.progress-input-shell textarea {
  min-height: 34px;
  max-height: 118px;
  padding: 8px 0;
  font-size: 12.5px;
  line-height: 1.4;
  transition: color 140ms ease;
}

.progress-input-shell textarea::placeholder {
  color: #8a9288;
}

.progress-input-shell:focus-within textarea::placeholder {
  color: #6f786e;
}

.composer-hint {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #8a9288;
  font-size: 9px;
  white-space: nowrap;
}

.composer-hint kbd {
  padding: 2px 6px;
  border: 1px solid #d3d8cc;
  border-bottom-width: 2px;
  border-radius: 6px;
  background: var(--paper, #f8f8f3);
  color: #5d6158;
  font-family: inherit;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.composer-hint.due {
  color: #9b6611;
  font-weight: 700;
}

.composer-hint.due::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #d99216;
}

.progress-send {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #e6e9e1;
  color: #99a094;
  box-shadow: none;
  transition: background 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 160ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.progress-send:disabled {
  background: #e6e9e1;
  color: #99a094;
  opacity: 1;
}

.progress-dock .progress-send.ready {
  background: linear-gradient(160deg, var(--signal, #a8f15b), var(--signal-strong, #7cc936));
  color: #23360f;
  box-shadow: 0 6px 18px rgba(117, 187, 56, 0.35);
}

.progress-dock .progress-send.ready:not(:disabled):hover {
  transform: translateY(-1px) scale(1.04);
  box-shadow: 0 9px 24px rgba(117, 187, 56, 0.45);
}

.progress-dock .progress-send.ready:not(:disabled):active {
  transform: translateY(0) scale(0.97);
}

@media (max-width: 640px) {
  .composer-hint {
    display: none;
  }
}

/* ============ Flat task row system (ref: quiet table rows) ============ */
/* Rows are hairline-divided, borderless, and neutral. Color lives in the
   status pill, the due column, and heroes — never in row surfaces. */

.task-records .workspace-task {
  border: 0;
  border-radius: 8px;
  background: transparent;
  box-shadow: none;
  transform: none;
  align-items: center;
}

.task-row-ring {
  justify-self: center;
}

/* Explicit column pinning: conditional cells (ring, due, menu) must never
   shift the status pill or the menu. Historical rows keep the same tracks. */
.task-records .workspace-task > .task-check { grid-column: 1; }
.task-records .workspace-task > .task-row-body { grid-column: 2; }
.task-records .workspace-task > .task-row-ring { grid-column: 3; justify-self: center; }
.task-records .workspace-task > .task-due { grid-column: 4; justify-self: end; text-align: right; }
.task-records .workspace-task > .task-state { grid-column: 5; justify-self: start; }
.task-records .workspace-task > .workspace-task-menu { grid-column: 6; justify-self: end; }

@media (max-width: 700px) {
  .task-records .workspace-task > .task-state { grid-column: 3; }
  .task-records .workspace-task > .workspace-task-menu { grid-column: 4; }
}

.task-records .workspace-task:hover {
  border-color: transparent;
  background: #f3f6ef;
  transform: none;
  box-shadow: none;
}

.workspace-task.is-surfaced {
  background: transparent;
  box-shadow: none;
}

.workspace-task:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px rgba(124, 201, 54, 0.35);
}

/* Direct completion lives on the row, like the active-day list. */
.task-records .task-check {
  width: 22px;
  height: 22px;
  margin-left: 2px;
}

.workspace-task.is-completed .task-check {
  border-color: #a9d67c;
  background: #e8f4da;
}

/* Selection marker: a quiet tag, not a surface flood. */
.surfaced-tag {
  flex: 0 0 auto;
  padding: 2px 7px;
  border-radius: 999px;
  background: #e8f4da;
  color: #477527;
  font-size: 8.5px;
  font-weight: 750;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* Due date as its own quiet column; overdue borrows the danger color. */
.task-due {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.task-due.danger {
  color: #a0372b;
  font-weight: 750;
}

/* Provenance warning stays a quiet amber note in the meta line. */
.task-row-line .sync-warn {
  color: #a56d0f;
  font-weight: 650;
}

.task-row-line.secondary-line .task-assignee-tags {
  margin: 0;
}

/* Status pill sizing inside workspace rows: ref-style compact. */
.task-records .task-state {
  min-width: 62px;
  font-size: 8.5px;
}

/* ============ Dashboard (My day) — pre-shift ============ */

.day-grid.off-shift-day {
  grid-template-areas:
    "hero pulse"
    "kpi kpi"
    "tasks tasks";
}

.kpi-strip {
  grid-area: kpi;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

/* Strip sits below the active-day card inside the same page column. */
.active-day-page .kpi-strip {
  margin-top: 14px;
}

.kpi-card {
  display: grid;
  min-width: 0;
  min-height: 88px;
  align-content: center;
  gap: 3px;
  padding: 14px 18px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface-raised);
  box-shadow: var(--shadow-card);
  color: var(--ink);
  text-align: left;
  transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
}

.kpi-card:not(:disabled):hover {
  border-color: #b9cfaa;
  transform: translateY(-1px);
}

.kpi-card:disabled {
  cursor: default;
  opacity: 1;
}

.kpi-card small {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.kpi-card small svg {
  color: #6c7569;
}

.kpi-card strong {
  font: 700 26px/1.15 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.kpi-card strong.kpi-danger {
  color: #a0372b;
}

.kpi-card em {
  color: var(--muted);
  font-size: 10px;
  font-style: normal;
}

.kpi-card em.kpi-attention {
  color: #a0372b;
  font-weight: 700;
}

/* Today's tasks: content cards with soft wash + progress ticks. */
.dashboard-tasks-card {
  grid-area: tasks;
  padding: 18px 20px 20px;
}

.dashboard-task-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.dashboard-task-card {
  display: grid;
  min-width: 0;
  min-height: 128px;
  align-content: start;
  gap: 7px;
  padding: 14px 15px;
  border: 1px solid #e2e7de;
  border-radius: 12px;
  background:
    radial-gradient(circle at 12% -10%, rgba(168, 241, 91, 0.14), transparent 9rem),
    #ffffff;
  cursor: pointer;
  text-align: left;
  transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
}

.dashboard-task-card:hover {
  border-color: #bcd9a1;
  box-shadow: 0 10px 26px rgba(20, 30, 18, 0.08);
  transform: translateY(-1px);
}

.dashboard-task-card:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px rgba(124, 201, 54, 0.35);
}

.dashboard-task-card h3 {
  display: -webkit-box;
  overflow: hidden;
  font-size: 13px;
  line-height: 1.35;
  letter-spacing: -0.01em;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.dashboard-task-card p {
  display: -webkit-box;
  overflow: hidden;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.45;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.dashboard-task-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: auto;
}

.progress-ticks {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.progress-ticks i {
  display: inline-flex;
  gap: 2px;
}

.progress-ticks i i,
.progress-ticks > i {
  width: 5px;
  height: 10px;
  border-radius: 2px;
  background: #e3e8e0;
}

.progress-ticks > i.on {
  background: var(--signal-strong);
}

.progress-ticks em {
  color: var(--muted);
  font-size: 9.5px;
  font-style: normal;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.dashboard-task-empty {
  display: grid;
  justify-items: start;
  gap: 4px;
  padding: 16px 4px;
  color: var(--muted);
}

/* Focus line lives inside the hero now. */
.hero-focus-line {
  display: grid;
  max-width: 560px;
  gap: 3px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid rgba(217, 222, 213, 0.9);
}

.hero-focus-line > small {
  color: #557d35;
  font-size: 9px;
  font-weight: 780;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.hero-focus-line > button {
  display: inline-flex;
  max-width: 100%;
  align-items: baseline;
  gap: 8px;
  padding: 2px 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
}

.hero-focus-line > button span {
  overflow: hidden;
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hero-focus-line > button:hover span {
  text-decoration: underline;
  text-decoration-color: #91c568;
  text-underline-offset: 3px;
}

.hero-focus-line > em {
  color: var(--muted);
  font-size: 9.5px;
  font-style: normal;
}

/* Responsive stacking — appended last so it wins the cascade at every width. */
@media (max-width: 900px) {
  .day-grid,
  .day-grid.off-shift-day {
    grid-template-columns: 1fr;
    grid-template-areas:
      "hero"
      "pulse"
      "kpi"
      "tasks";
  }

  .kpi-strip {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .dashboard-task-grid {
    grid-template-columns: 1fr;
  }
}


/* Optimistic task rows: spinner while syncing, retry + discard when failed. */
.pending-indicator {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #6b7a63;
}

.pending-indicator.failed {
  color: #a0372b;
}

.pending-indicator .loading-arc {
  color: #6f8f5c;
}

.pending-retry {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border: 1px solid #eec0b8;
  border-radius: 8px;
  background: #fbe7e3;
  color: #a0372b;
  cursor: pointer;
}

.pending-retry:hover {
  background: #f7d9d3;
}

.pending-dismiss {
  display: grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: #9a8f8c;
  cursor: pointer;
}

.pending-dismiss:hover {
  background: #f4efed;
  color: #a0372b;
}

.dashboard-task-card.pending {
  border-style: dashed;
}

.active-task-list article.pending {
  background: #fbfcf7;
}

/* Goal auto-save state beside the focus statement. */
.goal-retry {
  display: inline-grid;
  width: 22px;
  height: 22px;
  place-items: center;
  margin-left: 6px;
  border: 1px solid #eec0b8;
  border-radius: 7px;
  background: #fbe7e3;
  color: #a0372b;
  cursor: pointer;
  vertical-align: middle;
}

.goal-retry:hover {
  background: #f7d9d3;
}

.goal-retry .loading-arc,
.hero-focus-line .loading-arc,
.active-focus-copy .loading-arc,
.agenda-strip-meta .loading-arc {
  color: #5b8f2e;
}

/* Floating selection annotator + annotation review card */
.selection-annotator {
  position: fixed;
  z-index: 70;
  display: grid;
  gap: 8px;
  width: 344px;
  padding: 12px;
  border: 1px solid #d8dcd2;
  border-radius: 13px;
  background: #ffffff;
  box-shadow: 0 18px 44px rgba(18, 27, 17, 0.18);
  animation: annotation-pop-in 160ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.selection-annotator-quote {
  display: -webkit-box;
  overflow: hidden;
  color: var(--muted);
  font-size: 10.5px;
  font-style: italic;
  line-height: 1.4;
  overflow-wrap: anywhere;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.selection-annotator-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
}

.selection-annotator-row textarea {
  flex: 1;
  min-width: 0;
  min-height: 34px;
  max-height: 96px;
  padding: 7px 10px;
  border: 1px solid #cfd5c9;
  border-radius: 9px;
  background: #fff;
  color: var(--ink);
  font: inherit;
  font-size: 12.5px;
  line-height: 1.45;
  resize: none;
}

.selection-annotator-row textarea:focus {
  outline: none;
  border-color: var(--signal-strong);
  box-shadow: 0 0 0 3px rgba(124, 201, 54, 0.22);
}

.selection-annotator-save,
.selection-annotator-cancel {
  display: grid;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 9px;
  cursor: pointer;
}

.selection-annotator-save {
  border: 1px solid #a6e852;
  background: var(--signal);
  color: #141611;
}

.selection-annotator-save:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.selection-annotator-cancel {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--muted);
}

.selection-annotator-cancel:hover {
  color: var(--ink);
}

.annotation-popover {
  position: fixed;
  z-index: 71;
  display: grid;
  gap: 2px;
  width: 328px;
  max-height: 340px;
  overflow-y: auto;
  padding: 6px;
  border: 1px solid #d8dcd2;
  border-radius: 13px;
  background: #ffffff;
  box-shadow: 0 18px 44px rgba(18, 27, 17, 0.18);
  animation: annotation-pop-in 160ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.annotation-entry {
  display: grid;
  gap: 7px;
  padding: 10px;
}

.annotation-entry + .annotation-entry {
  border-top: 1px solid var(--line);
}

.annotation-quote {
  color: var(--muted);
  font-size: 10.5px;
  font-style: italic;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.annotation-comment {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.45;
}

.annotation-popover textarea {
  min-height: 56px;
  padding: 7px 9px;
  border: 1px solid #cfd5c9;
  border-radius: 9px;
  background: #fff;
  color: var(--ink);
  font: inherit;
  font-size: 12.5px;
  line-height: 1.45;
  resize: vertical;
}

.annotation-popover textarea:focus {
  outline: none;
  border-color: var(--signal-strong);
  box-shadow: 0 0 0 3px rgba(124, 201, 54, 0.22);
}

.annotation-actions {
  display: flex;
  gap: 6px;
}

.annotation-actions button {
  display: inline-flex;
  min-height: 30px;
  align-items: center;
  gap: 5px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  font-size: 11.5px;
  font-weight: 650;
  cursor: pointer;
}

.annotation-actions button.primary {
  border-color: #a6e852;
  background: var(--signal);
  color: #141611;
}

.annotation-actions button.danger {
  border-color: #ecd0ca;
  background: #fff5f3;
  color: #a33d35;
}

.annotation-actions button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.planning-annotation-mark {
  cursor: pointer;
}

.planning-annotation-mark:hover,
.planning-annotation-mark:focus-visible {
  background: #d9f0bd;
  outline: none;
}

@keyframes annotation-pop-in {
  from {
    opacity: 0;
    transform: translateY(4px) scale(0.97);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .selection-annotator,
  .annotation-popover {
    animation: none;
  }
}

/* EOD annotations tray + motion */
.eod-composer > * {
  animation: eod-rise 300ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

.eod-composer > *:nth-child(2) { animation-delay: 40ms; }
.eod-composer > *:nth-child(3) { animation-delay: 80ms; }
.eod-composer > *:nth-child(4) { animation-delay: 120ms; }
.eod-composer > *:nth-child(5) { animation-delay: 160ms; }
.eod-composer > *:nth-child(6) { animation-delay: 200ms; }

.eod-preview,
.eod-raw {
  animation: eod-fade 200ms ease both;
}

.eod-screenshot-body {
  animation: eod-reveal 220ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

.eod-notes {
  display: grid;
  gap: 8px;
  padding: 14px 16px;
  border: 1px solid #dbe3d3;
  border-radius: 12px;
  background: #f7faf3;
}

.eod-notes header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.eod-notes header span {
  font-size: 12px;
  font-weight: 700;
}

.eod-notes header small {
  color: var(--muted);
  font-size: 10px;
}

.eod-notes ul {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.eod-notes li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 10px;
  align-items: center;
  padding: 8px 10px;
  border: 1px solid #e3e9dc;
  border-radius: 9px;
  background: #fff;
  animation: eod-note-in 200ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

.eod-note-quote {
  grid-column: 1;
  justify-self: start;
  padding: 0;
  border: 0;
  background: transparent;
  color: #557d35;
  font-size: 10.5px;
  font-style: italic;
  text-align: left;
  cursor: pointer;
}

.eod-note-quote:hover {
  text-decoration: underline;
}

.eod-note-comment {
  grid-column: 1;
  color: var(--ink);
  font-size: 12px;
  line-height: 1.4;
}

.eod-note-remove {
  display: grid;
  width: 24px;
  height: 24px;
  grid-column: 2;
  grid-row: 1 / span 2;
  place-items: center;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: #9a8f8c;
  cursor: pointer;
}

.eod-note-remove:hover {
  background: #f4efed;
  color: #a0372b;
}

.eod-note-count {
  padding: 2px 8px;
  border-radius: 999px;
  background: #e8f4da;
  color: #477527;
  font-size: 9px;
  font-weight: 750;
}

.eod-quote-flash {
  background: #d9f0bd;
  border-radius: 3px;
}

.eod-submitted {
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 34px 28px;
  text-align: center;
  animation: eod-submitted-in 320ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

.eod-submitted svg {
  color: #4f8119;
}

.eod-submitted strong {
  font-size: 18px;
}

.eod-submitted p {
  margin: 0;
  color: var(--muted);
  font-size: 12.5px;
}

@keyframes eod-rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

@keyframes eod-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes eod-reveal {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: none; }
}

@keyframes eod-note-in {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: none; }
}

@keyframes eod-submitted-in {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .eod-composer > *,
  .eod-preview,
  .eod-raw,
  .eod-screenshot-body,
  .eod-notes li,
  .eod-submitted {
    animation: none !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  .progress-input-shell,
  .progress-input-shell textarea,
  .progress-send {
    transition: none;
  }

  .progress-input-shell:focus-within {
    transform: none;
  }
}

/* Loading screen: when the day fails to load, the recovery actions must
   include the offline bypass and the debugger — not only Retry. */
.loading-alternatives {
  display: flex;
  gap: 8px;
  margin-top: 2px;
}

.loading-alternatives button {
  min-height: 38px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper);
  color: var(--ink);
  font-size: 11px;
  font-weight: 650;
}

.loading-alternatives button.quiet {
  border-color: transparent;
  background: transparent;
  color: var(--muted);
}

.loading-alternatives button:not(:disabled):hover {
  border-color: #b8b9af;
  background: #fffef8;
}

.loading > small {
  max-width: 420px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.5;
  text-align: center;
}

/* Interpretation review — AI-drafted operations awaiting approval */
.progress-message.assistant > div { min-width: 0; flex: 1 1 auto; }

.progress-history > * { min-width: 0; }

.interpretation-list {
  display: grid;
  gap: 7px;
  margin-top: 10px;
  min-width: 0;
  text-align: left;
}

.interpretation-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 6px 9px;
  align-items: center;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper, #f8f8f3);
  font-size: 10px;
  font-weight: 650;
  color: var(--ink);
}

.interpretation-row.off {
  opacity: 0.62;
}

.interpretation-row input[type="checkbox"] {
  justify-self: start;
  accent-color: #74a936;
}

.interpretation-statement {
  width: 100%;
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  padding: 4px 6px;
  color: var(--ink);
  font-size: 10px;
  line-height: 1.45;
}

.interpretation-statement:focus {
  outline: none;
  border-color: #a7c982;
  background: #fffef9;
}

.tool-approval-card .interpretation-statement-filed {
  margin: 4px 0 0;
  color: var(--ink);
  font-size: 11px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.interpretation-row select {
  grid-column: 2;
  min-height: 28px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface-raised, #fbfcf8);
  color: var(--ink);
  font-size: 9px;
}

.approve-interpretation {
  justify-self: end;
  min-height: 34px;
  margin-top: 4px;
  padding: 0 14px;
  font-size: 10px;
  font-weight: 720;
}

/* EOD composer — Slice C */
.eod-composer {
  display: grid;
  gap: 16px;
  margin-bottom: 14px;
}

.eod-composer-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.eod-composer-header span {
  color: #557d35;
  font-size: 9px;
  font-weight: 780;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.eod-composer-header h2 {
  margin: 5px 0 0;
  font: 650 20px/1.2 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: -0.03em;
}

.eod-composer-header small {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.5;
}

.eod-composer-header button {
  min-height: 34px;
  flex: 0 0 auto;
  padding: 0 14px;
  border: 0;
  border-radius: 9px;
  background: var(--surface, #eef1eb);
  color: var(--ink);
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}

.eod-composer-header button:not(:disabled):hover {
  background: #e2e9dc;
}

.eod-composer-header button:disabled {
  opacity: 0.55;
  cursor: default;
}

.eod-composer-header button:focus-visible,
.eod-refine-actions button:focus-visible,
.eod-view-toggle button:focus-visible {
  outline: 2px solid #7cc936;
  outline-offset: 2px;
}

.eod-screenshot-context { margin: 0 22px 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-raised); color: var(--muted); }
.eod-screenshot-context summary { cursor: pointer; color: var(--ink); font-size: 11px; font-weight: 700; }
.eod-screenshot-context p, .eod-screenshot-context small { display: block; margin: 8px 0 0; font-size: 10px; line-height: 1.45; }
.eod-screenshot-context ul { display: grid; gap: 7px; margin: 10px 0 0; padding: 0; list-style: none; }
.eod-screenshot-context li { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 8px; font-size: 10px; line-height: 1.4; }
.eod-screenshot-context time { color: var(--muted); font-variant-numeric: tabular-nums; }
.eod-screenshot-unavailable { margin: 0 22px 18px; color: var(--muted); font-size: 10px; line-height: 1.45; }

.eod-report {
  display: grid;
  gap: 8px;
}

.eod-report-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.eod-report-head > span {
  color: #666a61;
  font: 600 10px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.eod-view-toggle {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  border-radius: 999px;
  background: var(--surface, #eef1eb);
}

.eod-view-toggle button {
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  padding: 5px 14px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

.eod-view-toggle button.active {
  background: #fff;
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(20, 30, 18, 0.14);
}

.eod-view-toggle button:not(.active):hover {
  color: var(--ink);
}

.eod-view-toggle button:disabled {
  opacity: 0.55;
  cursor: default;
}

.eod-preview {
  padding: 4px 2px;
  color: var(--ink);
  font-size: 12px;
  line-height: 1.6;
}

.eod-preview .chat-markdown p {
  margin: 0 0 10px;
}

.eod-preview .chat-markdown .chat-markdown-heading {
  display: block;
  margin: 16px 0 6px;
  font-size: 13px;
  font-weight: 750;
  letter-spacing: -0.01em;
}

.eod-preview .chat-markdown .chat-markdown-heading:first-child {
  margin-top: 0;
}

.eod-preview .chat-markdown ul {
  margin: 6px 0 10px;
  padding-left: 18px;
}

.eod-preview .chat-markdown li + li {
  margin-top: 4px;
}

.eod-preview .chat-markdown code {
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(24, 32, 24, 0.07);
  font: 600 0.88em/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
}

.eod-raw {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #fff;
  color: var(--ink);
  padding: 12px;
  font: 400 11px/1.6 ui-monospace, Consolas, monospace;
  resize: vertical;
}

.eod-raw:focus {
  outline: none;
  border-color: #a7c982;
  box-shadow: 0 0 0 4px rgba(129, 180, 70, 0.11);
}

.eod-bottleneck-label {
  display: grid;
  gap: 6px;
}

.eod-bottleneck-label > span {
  color: #666a61;
  font: 600 10px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.eod-bottleneck-label textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #fff;
  color: var(--ink);
  padding: 12px;
  font: 400 12px/1.5 Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  resize: vertical;
}

.eod-bottleneck-label textarea:focus {
  outline: none;
  border-color: #a7c982;
  box-shadow: 0 0 0 4px rgba(129, 180, 70, 0.11);
}

.eod-bottleneck-label small {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.45;
}

.eod-refine {
  display: grid;
  gap: 6px;
}

.eod-refine > span {
  color: #666a61;
  font: 700 10px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.eod-refine > small {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.45;
}

.eod-refine textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: var(--ink);
  font: 400 12px/1.5 Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  resize: vertical;
}

.eod-refine textarea:focus {
  outline: none;
  border-color: #a7c982;
  box-shadow: 0 0 0 4px rgba(129, 180, 70, 0.11);
}

.eod-refine-actions {
  display: flex;
  justify-content: flex-end;
}

.eod-refine-actions button {
  min-height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: 9px;
  background: var(--surface, #eef1eb);
  color: var(--ink);
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}

.eod-refine-actions button:not(:disabled):hover {
  background: #e2e9dc;
}

.eod-refine-actions button:disabled {
  opacity: 0.55;
  cursor: default;
}
.eod-bottleneck-label textarea:disabled { background: var(--surface, #eef1eb); color: var(--muted); cursor: not-allowed; }

.eod-composer > footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.eod-composer > footer small {
  color: var(--muted);
  font-size: 9px;
}


@media (max-width: 560px) {
  .eod-composer-header { flex-direction: column; }
  .eod-report-head { flex-wrap: wrap; }
}

/* Insights AI synthesis — Slice D */
.insight-synthesis > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.insight-synthesis > header > div {
  display: grid;
  gap: 3px;
}

.insight-synthesis > header span {
  display: inline-flex;
  align-items: center;

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@keyframes loading-ui-wave {
  0%,
  100% {
    transform: scaleY(1);
  }

  50% {
    transform: scaleY(0.6);
  }
}

.loading-wave {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  width: 96px;
  height: 30px;
  color: var(--signal);
}

.loading-wave-bar {
  display: inline-block;
  width: 4px;
  border-radius: 999px;
  background: currentColor;
  animation: loading-ui-wave var(--duration, 1s) ease-in-out infinite;
}

@keyframes loading-ui-fade-arc-spin {
  to {
    transform: rotate(360deg);
  }
}

.loading-arc {
  flex: 0 0 auto;
  color: currentColor;

@keyframes loading-ui-shimmer {
  0% {
    background-position: 120% 0;

    background-position: -120% 0;

.skeleton {

  font-size: 11px;
}

.quiet {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  padding: 0;
  border: 0;
  background: transparent;
  color: #898d83;
  cursor: pointer;
}

.quiet:hover {
  color: #cfd3c8;
}

/* Connect screen: entrance + connecting state ------------------------------ */

.connect > section {
  animation: connect-enter 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.connect > aside {
  animation: connect-enter 520ms 60ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes connect-enter {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

/* Seamless transition: the app content fades in over the loading surface. */
.workspace {
  animation: app-enter 300ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

@keyframes app-enter {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@media (max-width: 900px) {

    grid-template-columns: 1fr;
  }

  .skeleton-kpi-row {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  }
}

@media (prefers-reduced-motion: reduce) {

  .connect > aside,
  .workspace {
    animation: none !important;
  }

  .skeleton {
    background: rgba(226, 231, 222, 0.6);
  }
}
</style><style type="text/css" data-vite-dev-id="/home/maigreeks/projects/.worktrees/prior-eod/desktop/work-os-companion/src/otto.css">/* Otto — the Work OS focus robot.
   One rounded body, one signal-green visor, a lamp antenna, hover hands.
   Every pose is a real workday state; all motion is removed under
   prefers-reduced-motion. */

.otto {
  display: inline-block;
  width: 48px;
  height: 48px;
  overflow: visible;
  --otto-ink: #182018;
  --otto-visor: #14180f;
  --otto-paper: #f7f8f2;
  --otto-signal: #a8f15b;
}

.otto-shadow {
  fill: rgba(24, 32, 24, 0.12);
}

.otto-antenna {
  fill: none;
  stroke: var(--otto-ink);
  stroke-width: 2.5;
  stroke-linecap: round;
}

.otto-bulb {
  fill: var(--otto-signal);
}

.otto-shell {
  fill: var(--otto-paper);
  stroke: var(--otto-ink);
  stroke-width: 2.5;
}

.otto-visor {
  fill: var(--otto-visor);
}

.otto-eye,
.otto-dot {
  fill: var(--otto-signal);
}

.otto-ring {
  fill: none;
  stroke: var(--otto-signal);
  stroke-width: 2;
}

.otto-line {
  fill: none;
  stroke: var(--otto-signal);
  stroke-width: 2.6;
  stroke-linecap: round;
}

.otto-moon {
  fill: var(--otto-signal);
}

.otto-hand {
  fill: var(--otto-paper);
  stroke: var(--otto-ink);
  stroke-width: 2.5;
}

.otto-foot {
  stroke: var(--otto-ink);
  stroke-width: 2.5;
  stroke-linecap: round;
}

.otto-badge {
  fill: none;
  stroke: var(--otto-signal);
  stroke-width: 2.5;
  stroke-linecap: round;
}

.otto-sparkles {
  fill: var(--otto-signal);
}

.otto-concern {
  fill: none;
  stroke: #d4493f;
  stroke-width: 2.5;
  stroke-linecap: round;
}

.otto-figure {
  transform-origin: 48px 80px;
}

/* Pose motion -------------------------------------------------------------- */

.otto[data-pose="idle"] .otto-figure {
  animation: otto-breathe 4.2s ease-in-out infinite;
}

.otto[data-pose="sleep"] .otto-figure {
  animation: otto-breathe 6s ease-in-out infinite;
}

.otto[data-pose="sleep"] .otto-bulb {
  opacity: 0.35;
}

.otto[data-pose="focus"] .otto-figure {
  animation: otto-breathe 3.4s ease-in-out infinite;
}

.otto[data-pose="focus"] .otto-bulb,
.otto[data-pose="alert"] .otto-bulb,
.otto[data-pose="think"] .otto-bulb {
  animation: otto-glow 2.4s ease-in-out infinite;
}

.otto-eye,
.otto-moon,
.otto-ring {
  transform-origin: 48px 54px;
}

.otto-eye {
  animation: otto-blink 5.2s linear infinite;
}

.otto[data-pose="alert"] .ring-pulse {
  animation: otto-ring 1.6s ease-out infinite;
}

.otto[data-pose="think"] .otto-dot {
  animation: otto-think 1.2s ease-in-out infinite;
}

.otto[data-pose="think"] .dot-2 {
  animation-delay: 0.15s;
}

.otto[data-pose="think"] .dot-3 {
  animation-delay: 0.3s;
}

.otto[data-pose="celebrate"] .otto-figure {
  animation: otto-hop 900ms cubic-bezier(0.2, 0.75, 0.25, 1) 2;
}

.otto[data-pose="celebrate"] .otto-sparkles {
  animation: otto-sparkle 900ms ease-out 2;
  transform-origin: 48px 40px;
}

.otto[data-pose="recover"] .otto-figure {
  transform: rotate(-6deg);
  animation: otto-settle 600ms ease-out both;
}

@keyframes otto-breathe {
  0%,
  100% {
    transform: scaleY(1);
  }

  50% {
    transform: scaleY(1.03);
  }
}

@keyframes otto-blink {
  0%,
  93%,
  100% {
    transform: scaleY(1);
  }

  95.5% {
    transform: scaleY(0.1);
  }
}

@keyframes otto-glow {
  0%,
  100% {
    opacity: 0.55;
  }

  50% {
    opacity: 1;
  }
}

@keyframes otto-ring {
  0% {
    transform: scale(0.7);
    opacity: 0.9;
  }

  70%,
  100% {
    transform: scale(1.25);
    opacity: 0;
  }
}

@keyframes otto-hop {
  0%,
  100% {
    transform: translateY(0);
  }

  35% {
    transform: translateY(-5px) rotate(3deg);
  }

  70% {
    transform: translateY(0);
  }
}

@keyframes otto-sparkle {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }

  40% {
    opacity: 1;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(1.15);
  }
}

@keyframes otto-think {
  0%,
  100% {
    opacity: 0.25;
  }

  50% {
    opacity: 1;
  }
}

@keyframes otto-settle {
  from {
    transform: rotate(-10deg);
  }

  to {
    transform: rotate(-6deg);
  }
}

/* Sizes -------------------------------------------------------------------- */

.otto-inline {
  width: 36px;
  height: 36px;
}

.otto-eod {
  width: 40px;
  height: 40px;
}

.otto-hero {

  height: auto;
  filter: drop-shadow(0 16px 28px rgba(24, 32, 24, 0.12));
}

.otto-connect {

.otto-connect .otto-bulb,

.otto-celebrate {

}

.avatar-pet.otto {
  width: 44px;
  height: 44px;
}

@media (prefers-reduced-motion: reduce) {

  .otto .otto-dot,
  .otto .otto-bulb,
  .otto .otto-sparkles {

  }

/* Otto preview fixture ------------------------------------------------------ */

.otto-preview-panel {

.otto-preview-sizes {

.otto-preview-dark .card-title span {
  color: #f3f1e9;
}
</style><style type="text/css" data-vite-dev-id="/home/maigreeks/projects/.worktrees/prior-eod/desktop/work-os-companion/src/work-os-chat.css">/* Work OS shared chat language — one interaction for the in-app dock
 * and the floating companion (design §25.11). Semantic tokens only;
 * shells keep their established borders, radius, and focus rings. */

@keyframes workos-fade-up {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes workos-pop-in {
  from { opacity: 0; transform: translateY(4px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── Header: context tabs + actions ─────────────────────────── */

/* Specificity note: the in-app flyout header has legacy
 * `header > div` / `header button` rules; these selectors outrank
 * them so the tabs keep their own layout in both shells. */
.workos-chat-head .workos-chat-tabs,
.avatar-tabs .workos-chat-tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
}

.workos-chat-head .workos-chat-tabs button,
.avatar-tabs .workos-chat-tabs button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  width: auto;
  height: auto;
  padding: 4px 9px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink, #182018);
  font: 600 13px/1.4 Manrope, Inter, "Segoe UI", sans-serif;
  opacity: 0.5;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 120ms ease, opacity 120ms ease;
}

.workos-chat-head .workos-chat-tabs button:hover,
.avatar-tabs .workos-chat-tabs button:hover { opacity: 0.75; }
.workos-chat-head .workos-chat-tabs button.active,
.avatar-tabs .workos-chat-tabs button.active { background: var(--surface, #eef1eb); opacity: 1; }
.workos-chat-head .workos-chat-tabs button:focus-visible,
.avatar-tabs .workos-chat-tabs button:focus-visible {
  outline: 2px solid var(--signal-strong, #7cc936);
  outline-offset: 1px;
  opacity: 1;
}

.workos-tab-count {
  min-width: 18px;
  padding: 1px 5px;
  border-radius: 999px;
  background: var(--surface, #eef1eb);
  color: var(--muted, #626a61);
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.workos-chat-sub {
  margin: 0;
  padding: 6px 2px 0;
  color: var(--muted, #626a61);
  font-size: 11px;
  line-height: 1.4;
}

/* ── Thread: fixed scroll region, bubbles, sections ─────────── */

/* The in-app user bubble is established (.progress-message.user);
 * the thread keeps it and only animates assistant sections in. */

.workos-thread .progress-message.assistant,
.workos-thread .chat-entry {
  animation: workos-fade-up 220ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

/* Resolving shimmer state for the in-flight assistant section. */
.workos-thread .workos-resolving {
  opacity: 0.55;
  filter: blur(0.5px);
  transform: scale(0.985);
  transform-origin: top left;
  transition: opacity 220ms cubic-bezier(0.2, 0.8, 0.2, 1), filter 220ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* ── Composer ───────────────────────────────────────────────── */

.workos-promptbar { width: 100%; min-width: 0; }

.workos-composer-anchor { position: relative; }

.workos-controls {
  display: grid;
  align-items: end;
  gap: 4px 6px;
}

.workos-controls.inline { grid-template-columns: 36px minmax(0, 1fr) 36px; }
.workos-controls.inline.has-footer { grid-template-columns: 36px minmax(0, 1fr) auto 36px; }
.workos-controls.wide { grid-template-columns: 36px minmax(0, 1fr) 36px; }
.workos-controls.wide.has-footer { grid-template-columns: 36px auto minmax(0, 1fr) 36px; }
.workos-controls.wide .workos-input { grid-column: 1 / -1; grid-row: 1; }
.workos-controls.wide .workos-plus { grid-column: 1; grid-row: 2; }
.workos-controls.wide .workos-send { grid-column: -1; grid-row: 2; }
.workos-footer-left { display: contents; }
.workos-controls.inline .workos-footer-left > * { grid-column: 3; }
.workos-controls.wide.has-footer .workos-footer-left > * {
  grid-column: 2;
  grid-row: 2;
  justify-self: start;
}

.workos-plus {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted, #626a61);
  cursor: pointer;
  transition: background-color 150ms ease, color 150ms ease, transform 150ms ease;
}

.workos-plus:hover { background: rgba(24, 32, 24, 0.06); color: var(--ink, #182018); }
.workos-plus:active { transform: scale(0.94); }
.workos-plus.open { background: rgba(24, 32, 24, 0.08); color: var(--ink, #182018); }
.workos-plus.open svg { transform: rotate(45deg); }
.workos-plus svg { transition: transform 150ms ease; }
.workos-plus:focus-visible {
  outline: 2px solid var(--signal-strong, #7cc936);
  outline-offset: 1px;
}

.workos-input {
  min-width: 0;
  width: 100%;
  min-height: 36px;
  padding: 8px 2px;
  border: 0;
  resize: none;
  background: transparent;
  color: var(--ink, #182018);
  font: 400 13px/1.4 Manrope, Inter, "Segoe UI", sans-serif;
  outline: none;
  overflow-wrap: anywhere;
}

.workos-input::placeholder { color: #8a9288; }

/* The dock shell already carries the focus ring (border + halo +
 * lift); an inner textarea ring would double it. The avatar shell
 * has no focus ring, so the global textarea ring stays there. */
.progress-input-shell .workos-input:focus-visible {
  outline: none;
  box-shadow: none;
}

.workos-send {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 0;
  border-radius: 11px;
  background: var(--line, #d9ded5);
  color: var(--muted, #626a61);
  cursor: pointer;
  transition: background-color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), color 160ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.workos-send.ready { background: var(--ink, #182018); color: var(--white, #ffffff); }
.workos-send.ready:hover { transform: translateY(-1px); }
.workos-send.ready:active { transform: scale(0.96); }
.workos-send:disabled { cursor: default; }
.workos-send:focus-visible {
  outline: 2px solid var(--signal-strong, #7cc936);
  outline-offset: 2px;
}

/* ── @ / menu ─────────────────────────────────────────────── */

.workos-menu {
  position: absolute;
  inset-inline: 0;
  bottom: calc(100% + 8px);
  z-index: 10;
  max-height: 264px;
  overflow-y: auto;
  padding: 4px;
  border: 1px solid var(--line, #d9ded5);
  border-radius: 10px;
  background: var(--white, #ffffff);
  box-shadow: 0 18px 60px rgba(18, 27, 17, 0.14);
  transform-origin: bottom center;
  animation: workos-pop-in 180ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.workos-menu-glide {
  position: absolute;
  inset-inline: 4px;
  border-radius: 6px;
  background: rgba(24, 32, 24, 0.06);
  pointer-events: none;
  transition: top 220ms cubic-bezier(0.2, 0.8, 0.2, 1), height 220ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 150ms ease;
}

.workos-menu-row {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 36px;
  padding: 6px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.workos-menu-row:focus-visible {
  outline: 2px solid var(--signal-strong, #7cc936);
  outline-offset: -2px;
}

.workos-menu-icon {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  width: 22px;
  color: var(--muted, #626a61);
}

.workos-menu-name {
  flex: 0 0 auto;
  color: var(--ink, #182018);
  font-size: 12.5px;
  font-weight: 600;
}

.workos-menu-desc {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted, #626a61);
  font-size: 12px;
}

.workos-menu-empty {
  display: flex;
  align-items: center;
  min-height: 36px;
  padding: 6px 8px;
  color: var(--muted, #626a61);
  font-size: 12px;
}

.workos-menu-foot {
  margin-top: 4px;
  padding: 6px 8px 4px;
  border-top: 1px solid var(--line, #d9ded5);
  color: var(--muted, #626a61);
  font-size: 11px;
}

/* ── Shell integration (shells keep their established treatment) ── */

.avatar-tabs { padding: 8px 12px 0; }
.avatar-tabs .workos-chat-tabs button.active { background: rgba(23, 25, 20, 0.06); }

.progress-input-shell > .workos-promptbar,
.avatar-composer > .workos-promptbar {
  flex: 1 1 auto;
  min-width: 0;
}

.avatar-composer { position: relative; }

/* The shell carries one soft focus halo (mirroring the previous input
 * treatment) so the field itself needs no inner ring. */
.avatar-composer:focus-within {
  border-top-color: var(--avatar-signal, #8bc34a);
  box-shadow:
    inset 0 0 0 1px var(--avatar-signal, #8bc34a),
    0 0 0 3px rgba(139, 195, 74, 0.35);
}

.avatar-composer .workos-input:focus-visible {
  outline: none;
  box-shadow: none;
}

.workos-chat-head { gap: 8px; }

.progress-flyout .workos-chat-sub { padding: 8px 18px 0; }

/* ── Responsive ───────────────────────────────────────────── */

@media (max-width: 560px) {
  .workos-chat-head .workos-chat-tabs,
  .avatar-tabs .workos-chat-tabs { overflow-x: auto; scrollbar-width: none; }
  .workos-chat-head .workos-chat-tabs::-webkit-scrollbar,
  .avatar-tabs .workos-chat-tabs::-webkit-scrollbar { display: none; }
  .workos-menu-row { min-height: 40px; }
}

@media (prefers-reduced-motion: reduce) {
  .workos-thread .progress-message.assistant,
  .workos-thread .chat-entry,
  .workos-menu,
  .workos-plus,
  .workos-plus svg,
  .workos-send,
  .workos-chat-tabs button,
  .workos-thread .workos-resolving {
    animation: none;
    transition: none;
  }
}
