.hero-card,
.pulse-card,
.capture-card,
.focus-card,
.panel,
.proposal-card,
.metric,
.evidence-list,
.settings-panel {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 16px;
}
.hero-card {
  min-height: 280px;
  position: relative;
  overflow: hidden;
  background: #1b1d18;
  color: #f7f5ed;
  padding: 34px;
  display: flex;
  align-items: center;
}
.hero-copy {
  position: relative;
  z-index: 1;
  max-width: 59%;
}
.kicker,
.page-intro > span {
  display: inline-block;
  color: #8d9187;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font: 600 10px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
}
.hero-copy h2 {
  font: 600 clamp(30px, 4vw, 48px)/1.02 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: -0.045em;
  margin: 12px 0;
}
.hero-copy p {
  color: #adb0a7;
  line-height: 1.55;
  font-size: 13px;
}
.hero-actions {
  display: flex;
  gap: 8px;
  margin-top: 24px;
}
.hero-actions button,
.primary {
  border: 1px solid #3b3e35;
  border-radius: 9px;
  background: #262822;
  color: #fff;
  min-height: 38px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.primary {
  background: var(--signal);
  color: #141611;
  border-color: #a6e852;
  font-weight: 600;
  box-shadow: 0 5px 14px rgba(143, 203, 64, 0.15);
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.pulse-card {
  padding: 22px;
  display: flex;
  flex-direction: column;
}
.card-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.card-title > span {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 600 13px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
}
.card-title small {
  color: var(--muted);
  font-size: 10px;
}
.card-title button {
  display: flex;
  align-items: center;
  gap: 2px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
}
.pulse-time {
  font: 600 48px/1 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: -0.06em;
  margin: 14px 0;
}
.meter {
  height: 5px;
  background: #dddcd3;
  border-radius: 8px;
  overflow: hidden;
}
.meter i {
  display: block;
  height: 100%;
  background: var(--signal);
  border-radius: inherit;
}
.stat-row {
  margin-top: auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}
.stat-row span {
  display: grid;
}
.stat-row small {
  font-size: 9px;
  color: var(--muted);
}
.stat-row strong {
  margin-top: 3px;
  font-size: 12px;
}
.capture-card,
.focus-card {
  padding: 22px;
}
.capture-card textarea,
.intent textarea {
  width: 100%;
  resize: vertical;
  border: 0;
  background: #e9e8e0;
  border-radius: 10px;
  padding: 14px;
  min-height: 98px;
  color: var(--ink);
}
.capture-actions {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  gap: 10px;
}
.capture-actions select {
  border: 1px solid var(--line);
  border-radius: 9px;
  background: transparent;
  padding: 0 10px;
  color: #555950;
}
.focus-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 13px 0;
  border-top: 1px solid var(--line);
}
.focus-row > b {
  font: 500 10px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  color: #92958d;
}
.focus-row div {
  display: grid;
  gap: 3px;
}
.focus-row strong {
  font-size: 12px;
}
.focus-row small {
  font-size: 10px;
  color: var(--muted);
}
.focus-row > span,
.proposal-card > span,
.evidence-kind {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #73766e;
}
.page {
  max-width: 970px;
  margin: 0 auto;
}
.page-intro {
  max-width: 650px;
  margin: 18px 0 30px;
}
.page-intro h2 {
  font: 600 clamp(32px, 5vw, 54px)/1.02 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: -0.05em;
  margin: 10px 0;
}
.page-intro p {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.6;
  max-width: 590px;
}
.panel {
  padding: 24px;
}
.intent {
  display: grid;
  gap: 8px;
  font: 600 11px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
}
.plan-list {
  margin-top: 20px;
}
.plan-list article {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-top: 1px solid var(--line);
  transition: opacity 0.2s;
}
.plan-list article.deferred {
  opacity: 0.46;
}
.plan-list article > b {
  font-size: 10px;
  color: #8a8d84;
}
.plan-list article div:nth-child(2) {
  display: grid;
  gap: 3px;
}
.plan-list article strong {
  font-size: 13px;
}
.plan-list article small {
  font-size: 10px;
  color: var(--muted);
}
.plan-controls {
  display: flex;
  gap: 5px;
}
.plan-controls button,
.settings-panel button {
  min-height: 32px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ecebe4;
  padding: 0 9px;
}
.panel-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 20px;
}
.proposal-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.proposal-card {
  padding: 20px;
}
.proposal-card h3 {
  font: 600 17px/1.3 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
}
.proposal-card p {
  color: var(--muted);
  font-size: 11px;
}
.proposal-card > div {
  display: flex;
  justify-content: flex-end;
  gap: 7px;
  margin-top: 22px;
}
.proposal-card button {
  min-height: 34px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: transparent;
}
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.metric {
  padding: 18px;
  display: grid;
  gap: 10px;
}
.metric small {
  color: var(--muted);
  font-size: 10px;
}
.metric strong {
  font: 600 18px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
}
.insight {
  margin-top: 12px;
}
.insight h3 {
  font: 600 16px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
}
.signal-bars {
  display: grid;
  gap: 14px;
  margin: 20px 0;
}
.signal-bars span {
  display: grid;
  grid-template-columns: 150px 1fr;
  align-items: center;
  font-size: 11px;
  color: var(--muted);
}
.signal-bars span:after {
  content: "";
  height: 7px;
  background: #dfded6;
  border-radius: 8px;
  grid-column: 2;
  grid-row: 1;
}
.signal-bars b {
  height: 7px;
  background: var(--ink);
  border-radius: 8px;
  grid-column: 2;
  grid-row: 1;
  z-index: 1;
}
.insight p {
  font-size: 11px;
  color: var(--muted);
}
.evidence-list {
  padding: 8px 22px;
}
.evidence-list article {
  display: grid;
  grid-template-columns: 110px 1fr auto;
  gap: 18px;
  align-items: start;
  padding: 18px 0;
  border-top: 1px solid var(--line);
}
.evidence-list article:first-child {
  border: 0;
}
.evidence-kind.output {
  color: #4f8119;
}
.evidence-kind.activity {
  color: #806d58;
}
.task-state {
  width: max-content;
  min-width: 58px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 750;
  line-height: 1;
  letter-spacing: .07em;
  text-align: center;
  text-transform: uppercase;
}
.task-state.open {
  border-color: transparent;
  background: #edf0ea;
  color: #5b655a;
}
.task-state.complete {
  border-color: transparent;
  background: #e8f4da;
  color: #3c651d;
}
.task-state.overdue {
  border-color: transparent;
  background: #fbe7e3;
  color: #a0372b;
}
.task-state.sync-issue {
  border-color: transparent;
  background: #fff3d1;
  color: #7d5a10;
}
.evidence-list h3 {
  font: 600 14px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  margin: 0 0 5px;
}
.evidence-list p,
.evidence-list time {
  font-size: 10px;
  color: var(--muted);
  margin: 0;
}
.settings-panel {
  padding: 6px 22px;
}
.setting {
  min-height: 68px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}
.setting:first-child {
  border: 0;
}
.setting > div {
  display: grid;
  gap: 4px;
}
.setting strong {
  font-size: 12px;
}
.setting small {
  font-size: 10px;
  color: var(--muted);
  max-width: 460px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.setting input {
  accent-color: #78ad33;
}
.status-dot {
  font-size: 10px;
  color: #567b27;
}
.danger {
  color: var(--danger) !important;
}
.empty {
  min-height: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #85887f;
  padding: 20px;
}
.empty strong {
  color: #55584f;
  margin: 8px 0 4px;
}
.empty p {
  font-size: 11px;
  max-width: 300px;
  margin: 0;
  line-height: 1.5;
}
.connect {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  background: #171914;
  color: #f3f1e9;
  position: relative;
  overflow: hidden;
}

.connect > section {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(40px, 6vw, 76px);
  z-index: 1;
}

.wordmark.large {
  margin: 0;
}

.wordmark.large img {
  width: 38px;
  height: 38px;
}

.connect-stack {
  display: grid;
  max-width: 560px;
  gap: 14px;
  margin-bottom: clamp(24px, 9vh, 84px);
}

.connect .kicker {
  color: #8ea07f;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.connect h1 {
  font: 600 clamp(40px, 5.4vw, 68px)/1.02 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: -0.055em;
  margin: 0;
}

.connect p {
  margin: 0;
  color: #a8aaa2;
  font-size: 14px;
  line-height: 1.6;
  max-width: 440px;
}

.connect-button {
  margin-top: 10px;
  min-height: 46px;
  width: max-content;
  padding: 0 20px;
}

.connect-settings {
  margin-top: 8px;
  color: #898d83;
  font-size: 11px;
}

.connect-settings summary {
  cursor: pointer;
  color: #9aa093;
}

.connect-settings-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.connect-settings-row input {
  flex: 1;
  max-width: 300px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #41443b;
  background: #23251f;
  color: #fff;
}

.connect-settings-row button {
  min-height: 38px;
  padding: 0 14px;
  border: 1px solid #3a3d34;
  border-radius: 8px;
  background: #23251f;
  color: #cfd3c8;
  cursor: pointer;
}

.connect-settings-row button:hover {
  border-color: #5a5f4f;
  color: #fff;
}

.connect > aside {
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 50% 42%, rgba(168, 241, 91, 0.09), transparent 26rem),
    #1b1d18;
}

.connect > aside img {
  width: min(72%, 560px);
  filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.45));
}
.loading {
  min-height: 100vh;
  background: #171914;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.loading img {
  width: 54px;
}
.loading h1 {
  font: 600 28px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  margin: 18px 0 5px;
}
.loading p {
  color: #8d9187;
}
.debug-overlay {
  position: fixed;
  inset: 0;
  background: rgba(12, 13, 11, 0.72);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: center;
  padding: 22px;
  z-index: 20;
}
.debug-shell {
  background: #f5f4ed;
  color: var(--ink);
  min-height: 100vh;
}
.debug-shell.embedded {
  width: min(680px, 96vw);
  height: min(780px, 92vh);
  min-height: 0;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
}
.debug-header {
  height: 58px;
  padding: 0 18px;
  background: #191b16;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.debug-header > div {
  display: flex;
  gap: 10px;
  align-items: center;
}
.debug-header span {
  display: grid;
}
.debug-header small {
  color: #8d9187;
  font-size: 10px;
}
.debug-header button {
  background: transparent;
  border: 0;
  color: #fff;
}
.debug-content {
  height: calc(100% - 58px);
  overflow: auto;
  padding: 18px;
}
.debug-warning {
  background: #eeecd4;
  border: 1px solid #d8d39e;
  padding: 10px;
  border-radius: 8px;
  font-size: 11px;
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
}
.debug-section {
  border-top: 1px solid var(--line);
  padding: 16px 0;
}
.debug-section h2 {
  font: 600 12px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.preset-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.debug-section button,
.debug-reset {
  border: 1px solid var(--line);
  background: #ebeae2;
  min-height: 34px;
  border-radius: 8px;
}
.debug-section > label {
  display: grid;
  grid-template-columns: 160px 1fr;
  align-items: center;
  margin: 8px 0;
  font-size: 11px;
}
.debug-section select,
.debug-section input[type="number"] {
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: white;
}
.debug-checks {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}
.debug-checks label {
  display: flex;
  gap: 7px;
  font-size: 11px;
}
.debug-checks label span {
  display: grid;
}
.debug-checks small {
  font-size: 9px;
  color: var(--muted);
}
.debug-help {
  font-size: 10px;
  color: var(--muted);
}
.debug-reset {
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
@media (max-width: 850px) {
  .workspace {
    grid-template-columns: 68px 1fr;
  }
  .rail {
    width: 68px;
    padding: 18px 10px;
    align-items: center;
  }
  .wordmark {
    justify-content: center;
  }
  .wordmark span,
  .rail nav span,
  .rail-foot div {
    display: none;
  }
  .rail nav {
    margin-top: 28px;
    gap: 6px;
    width: 100%;
  }
  .rail nav button {
    justify-content: center;
    width: 48px;
    height: 44px;
    min-height: 44px;
    padding: 0;
    margin: 0 auto;
  }
  .rail nav button.active:before {
    left: -10px;
    height: 18px;
  }
  .rail nav button {
    position: relative;
  }
  .rail nav button::after {
    content: attr(data-label);
    position: absolute;
    left: calc(100% + 14px);
    top: 50%;
    transform: translateY(-50%) translateX(-4px);
    background: var(--ink);
    color: #f3f1e8;
    font: 600 11.5px/1 Manrope, Inter, "Segoe UI", sans-serif;
    padding: 7px 11px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.14s ease, transform 0.14s ease;
    box-shadow: 0 6px 18px rgba(13, 15, 12, 0.3);
  }
  .rail nav button:hover::after,
  .rail nav button:focus-visible::after {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }
  .rail nav em {
    position: absolute;
    top: 5px;
    right: 5px;
    margin: 0;
    min-width: 15px;
    height: 15px;
    padding: 0 4px;
    display: grid;
    place-items: center;
    font-size: 9px;
    line-height: 1;
    box-shadow: 0 0 0 2px var(--ink);
  }
  .rail-foot {
    width: 100%;
    justify-content: center;
    border-top: 0;
    padding: 0;
  }
  .rail-foot .presence {
    width: 10px;
    height: 10px;
  }
  .stage {
    padding: 0 18px 40px;
  }
  .day-grid {
    grid-template-columns: 1fr;
  }
  .metric-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .proposal-grid {
    grid-template-columns: 1fr;
  }
  .hero-copy {
    max-width: 70%;
  }
  .connect {
    grid-template-columns: 1fr;
  }
  .connect > aside {
    display: none;
  }
}
@media (max-width: 560px) {
  .workspace {
    display: block;
  }
  .rail {
    position: fixed;
    inset: auto 0 0;
    width: auto;
    height: 62px;
    flex-direction: row;
    z-index: 10;
    padding: 7px;
    background: #171914;
  }
  .rail > .wordmark,
  .rail-foot {
    display: none;
  }
  .rail nav {
    margin: 0;
    display: flex;
    width: 100%;
    justify-content: space-around;
  }
  .rail nav button {
    min-height: 48px;
    padding: 0 9px;
  }
  .rail nav button.active:before {
    left: 50%;
    top: -7px;
    width: 20px;
    height: 3px;
  }
  .rail nav button:nth-child(4),
  .rail nav button:nth-child(5) {
    display: none;
  }
  .stage {
    padding: 0 12px 80px;
  }
  .masthead {
    height: 78px;
  }
  .provider {
    display: none;
  }
  .hero-card {
    min-height: 260px;
    padding: 24px;
  }
  .hero-copy {
    max-width: 82%;
  }
  .capture-actions {
    flex-direction: column;
  }
  .capture-actions select,
  .capture-actions button {
    min-height: 40px;
  }
  .metric-grid {
    grid-template-columns: 1fr 1fr;
  }
  .evidence-list article {
    grid-template-columns: 1fr;
  }
  .signal-bars span {
    grid-template-columns: 1fr;
    gap: 5px;
  }
  .signal-bars span:after,
  .signal-bars b {
    grid-column: 1;
    grid-row: 2;
  }
  .connect > section {
    padding: 34px 24px;
  }
  .wordmark.large {
    margin-bottom: 70px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *:before,
  *:after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}

/* High-end application polish */
:root {
  --surface-elevated: #fbfaf5;
  --surface-muted: #efeee7;
  --shadow-soft: 0 10px 34px rgba(26, 29, 23, 0.055);
  --shadow-raised: 0 18px 54px rgba(23, 25, 20, 0.09);
  --ease-product: cubic-bezier(0.22, 1, 0.36, 1);
}
body {
  background:
    radial-gradient(circle at 72% -12%, rgba(255, 255, 255, 0.72), transparent 34%),
    #e9e8e1;
}
button,
a,
input,
textarea,
select,
summary {
  transition:
    color 0.18s var(--ease-product),
    background-color 0.18s var(--ease-product),
    border-color 0.18s var(--ease-product),
    box-shadow 0.18s var(--ease-product),
    transform 0.18s var(--ease-product),
    opacity 0.18s var(--ease-product);
}

/* Unified Tasks daily workspace */
.tasks-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; }
.date-navigator { display: flex; align-items: center; gap: 5px; margin-bottom: 30px; }
.date-navigator button, .formatted-date-picker { height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); }
.date-navigator button { width: 38px; display: grid; place-items: center; }
.formatted-date-picker { min-width: 132px; position: relative; display: grid; place-items: center; padding: 0 12px; overflow: hidden; font: 600 11px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif; }
.formatted-date-picker input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.daily-goal-card { margin-bottom: 12px; }

.goal-card-head small, .goal-independence { font-size: 9px; color: var(--muted); }
.daily-goal-card > textarea { width: 100%; min-height: 82px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: #f7f6ef; padding: 13px; font: 600 16px/1.45 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif; color: var(--ink); }
.daily-goal-card > p { font: 600 18px/1.45 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif; margin: 7px 0; }
.goal-suggestion { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin: 10px 0; padding: 12px; border: 1px solid #cfdabf; border-radius: 10px; background: rgba(184,255,90,.08); }
.goal-suggestion svg { color: #668c38; }
.goal-suggestion div { display: grid; gap: 3px; }
.goal-suggestion strong { font-size: 10px; }
.goal-suggestion p { margin: 0; font-size: 10px; color: var(--muted); }
.goal-suggestion button, .carry-flyout article button { border: 1px solid var(--line); border-radius: 7px; background: var(--paper); padding: 6px 8px; font-size: 8px; }
.goal-independence { display: block; margin-top: 9px; }
.carry-alert { width: 100%; display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px; margin: 0 0 12px; border: 1px solid #e2ca95; border-radius: 11px; background: #fff8e5; padding: 12px 14px; text-align: left; color: var(--ink); }
.carry-alert > svg:first-child { color: #9c6815; }
.carry-alert span { display: grid; gap: 3px; }
.carry-alert strong { font-size: 10px; }
.carry-alert small { max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #786b4d; font-size: 9px; }
.carry-alert em { font-style: normal; font-size: 9px; font-weight: 600; }
 .workspace-task { grid-template-columns: 24px minmax(0, 1fr) 64px 104px 76px 30px !important; overflow: visible; }
.workspace-task-menu { position: relative; z-index: 2; }
.workspace-task-menu.open { z-index: 64; }

}

.task-record-section {
  display: block;

}

}
.task-record-section > header {

.carry-flyout-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(18,20,17,.36); display: flex; justify-content: flex-end; }

.carry-flyout article > div:first-child { display: grid; gap: 3px; }
.carry-flyout article strong { font-size: 10px; }
.carry-flyout article small { font-size: 8px; color: var(--muted); }

.pulse-track {

.pulse-provider .pulse-provider-facts {

.pulse-provider-facts > span { display: grid; gap: 2px; min-width: 0; font-size: 10px; color: var(--muted); }
.pulse-provider-facts > span strong { overflow: hidden; color: var(--ink); font: 650 11px Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 720px) {

.delete-confirmation button {

  border: 1px solid var(--line);
  border-radius: 9px;

  padding: 0 15px;

.delete-confirmation .confirm-delete {
  border-color: #bd5c4c;
  background: #a84232;

@keyframes modalFade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes modalRise {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (max-width: 700px) {
  .insight-grid {
    grid-template-columns: 1fr;

  .tasks-workspace .date-navigator { margin-bottom: 18px; }

}

  }

}
.story-copy h1 {

.story-copy p {

.onboarding-workspace {

.onboarding-workspace > header {

.onboarding-workspace > header > span {

.quiet-action,

.phase-intro {

.identity-grid,

.identity-grid input,
.schedule-grid input,
.wide-input input,

.add-profile-item select {

.context-list {

.context-list > div {

.context-list span {

}
.context-list strong {

.provider-line {

.provider-line span {

.suggestion-note {

.archetype-grid button:hover {

.archetype-grid small {

.specialties {

.wide-input {

.profile-item > span {

}
.day-selector {

  height: 38px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #f4f3ec;
}
.day-selector button.selected {
  background: #171914;
  color: #fff;
  border-color: #171914;

.schedule-grid {

.breaks {

.breaks > div {

.preference-list {

}
.guided-toggle {

.guided-toggle span {

}
.guided-toggle strong {

}
.guided-toggle small {

.guided-toggle input,
.consent-box input {

.policy-summary {

  margin-bottom: 12px;
}
.policy-summary strong {
  font-size: 11px;
}
.policy-summary p,
.policy-summary details {
  font-size: 10px;

  color: var(--muted);
}
.policy-summary summary {

}
.consent-box {

}
.consent-box label {

  margin: 11px 0;
  font-size: 10px;
  line-height: 1.4;
}
.consent-box small {
  display: block;
  color: #94978f;
  font-size: 8px;
}
.connected-state {

  align-items: center;
  justify-content: center;
  text-align: center;
}
.connection-orb {

  height: 86px;
  border-radius: 50%;

  place-items: center;
  background: #d8f7af;

.connection-orb.unknown {
  background: #e7e6de;

  color: #60634f;
  animation: none;
}
.connected-state > small {
  margin-top: 22px;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  font-size: 8px;
  color: var(--muted);
}
.connected-state h2 {
  font: 600 38px/1.05 Manrope, Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  letter-spacing: -0.045em;
  margin: 10px 0;
}
.connected-state p {
  max-width: 460px;
  font-size: 11px;
  line-height: 1.6;
  color: var(--muted);
}
.connected-state .primary {
  margin-top: 20px;
}
.stale-status {

  color: #8a6f45;
  background: #f0e8d6;
  border-radius: 8px;
  padding: 7px 10px;
}
.onboarding-error {
  width: min(720px, calc(100% - 48px));

  display: flex;
  gap: 7px;
  align-items: center;
  border: 1px solid #efc1ba;
  border-radius: 9px;
  background: #fff1ee;
  color: #923c33;
  font-size: 10px;
}
.phase-actions {
  height: 72px;
  padding: 0 clamp(24px, 4vw, 52px);
  border-top: 1px solid #deddd4;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
}
.phase-actions > span {
  font-size: 8px;
  color: #8c8f87;
}
.phase-actions > button {
  justify-self: start;
}
.phase-actions .primary {
  justify-self: end;
}
.phase-actions .back {

  background: transparent;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;

.attendance-managed {

  align-items: center;
  min-height: 38px;
  color: #c8cbc2;
  font-size: 11px;
}
.debug-notice {
  padding: 9px 15px;
  background: #eeecd4;
  font-size: 10px;
}
.error {
  background: #fff1ee;
  border: 1px solid #efc1ba;
  color: #923c33;
  padding: 11px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  gap: 7px;
}
@keyframes phaseReveal {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes artReveal {
  from {
    opacity: 0.25;
    transform: scale(1.025);
  }
  to {
    opacity: 0.54;
    transform: scale(1);
  }
}
@keyframes connectedPulse {
  50% {
    box-shadow: 0 0 0 18px rgba(184, 255, 90, 0);
  }
}
@media (max-width: 840px) {
  .guided-onboarding {
    grid-template-columns: 34% 66%;
  }
  .archetype-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .profile-board {
    grid-template-columns: 1fr;
  }
  .story-copy h1 {
    font-size: 30px;
  }
}
@media (max-width: 720px) {
  .guided-onboarding {
    height: auto;
    min-height: 100vh;
    grid-template-columns: 1fr;
    overflow: auto;
  }
  .onboarding-story {
    min-height: 230px;
  }
  .story-copy {
    margin-top: 30px;
  }
  .story-copy h1 {
    font-size: 28px;
  }
  .phase-art {
    object-position: center 60%;
  }
  .onboarding-workspace {
    min-height: 600px;
    overflow: visible;
  }
  .phase-content {
    overflow: visible;
  }
  .identity-grid,
  .schedule-grid {
    grid-template-columns: 1fr;
  }
  .phase-actions {
    position: sticky;
    bottom: 0;
    background: #f5f3eb;
  }
  .profile-board {
    grid-template-columns: 1fr;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *:before,
  *:after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

  .nav-settings {
    width: 100%;
    margin-top: auto;
    padding-top: 18px;
    border-top: 1px solid #30322c;
  }
  .rail nav .nav-settings button {
    width: 100%;
    min-height: 46px;

.planning-status, .planning-notice, .planning-confirmed { display: flex; align-items: flex-start; gap: 8px; margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; font-size: 12px; line-height: 1.45; }

.active-task-tabs {
  gap: 5px;
}

.active-task-tabs button {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  min-height: 35px;
  padding: 0 12px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
}

.active-task-tabs button.active {
  background: #e9eee5;
  color: var(--ink);
}

.active-task-tabs em {
  min-width: 20px;
  padding: 2px 6px;
  border-radius: 999px;
  background: #dce3d6;
  color: #53624f;
  font-size: 9px;
  font-style: normal;
}

.active-task-tabs .alert-count {
  background: #d4493f;
  color: #fff;
}

.active-task-tabs .older-count {
  background: #d99216;
  color: #fff;
}

.older-task-notice {
  display: flex;
  gap: 8px;
  align-items: center;
  min-height: 38px;
  margin: 0 20px 6px;
  padding: 7px 10px;
  border: 1px solid #ebd09d;
  border-radius: 10px;
  background: #fff8e8;
  color: #76500c;
}

.older-task-notice > span {
  display: grid;
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 50%;
  background: #d99216;
  color: #fff;
  font-size: 9px;
  font-weight: 800;
}

.older-task-notice strong {
  font-size: 10px;
}

.older-task-notice small {
  color: #9a741f;
  font-size: 9px;
}

.add-day-task {
  min-height: 36px;
  padding-inline: 13px;
  font-size: 11px;
}

.active-task-list {
  min-height: 230px;
  padding: 0 20px 8px;
}

.active-task-list article {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto 30px;
  gap: 11px;
  align-items: center;
  min-height: 66px;
  padding: 9px 10px;
  border-top: 1px solid #e5e9e1;
  transition: background 150ms ease, transform 150ms ease;
}

.dashboard-task-menu {
  position: relative;
  z-index: 4;
}

.dashboard-task-menu.open {
  z-index: 64;
}

.dashboard-task-menu .ellipsis-button {
  width: 30px;
  height: 30px;
  padding: 0;
  transition: opacity 120ms ease, border-color 120ms ease, background 120ms ease;
}

.dashboard-task-menu .subtask-menu {
  z-index: 65;
  top: calc(100% + 5px);
  right: -6px;
  width: 194px;
}

.active-task-list:has(.dashboard-task-menu.open) .dashboard-task-menu:not(.open) .ellipsis-button {
  opacity: 0;
  pointer-events: none;
}

.active-task-list article:hover {
  background: #f3f6f0;
}

.task-check {
  display: grid;
  width: 22px;
  height: 22px;
  padding: 0;
  place-items: center;
  border: 1.5px solid #b9c2b3;
  border-radius: 7px;
  background: #fff;
  color: #315f17;
}

.active-task-list article.completed .task-check {
  border-color: #8fcb59;
  background: #dff3ca;
}

.active-task-copy {
  display: grid;
  gap: 4px;
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
}

.active-task-copy strong {
  overflow: hidden;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.active-task-copy small {
  color: var(--muted);
  font-size: 9px;
}

.completed .active-task-copy strong {
  color: #7b8379;
  text-decoration: line-through;
}

.task-status {
  padding: 4px 8px;
  border-radius: 999px;
  background: #eef1eb;
  color: #687166;
  font-size: 8px;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.task-status.done {
  background: #e4f3d5;
  color: #477527;
}

.active-day-footer {
  justify-content: space-between;
  min-height: 54px;
  padding: 9px 20px;
  border-top: 1px solid #e3e7df;
  background: #f5f7f3;
}

.active-day-footer > span {
  color: var(--muted);
  font-size: 9px;
}

.active-day-footer .workspace-link-button {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
}

.workspace-link-button svg {
  flex: 0 0 auto;
}

.progress-dock {
  position: sticky;
  z-index: 30;
  bottom: 16px;
  width: min(calc(100% - 48px), 760px);
  margin: -82px auto 0;
  filter: drop-shadow(0 18px 26px rgba(18, 27, 17, 0.12));
}

.agenda-dock .progress-input-shell {
  border-color: #bdceb3;
  box-shadow: 0 12px 34px rgba(49, 82, 31, 0.13);
}

.agenda-dock .progress-input-shell > svg,
.agenda-welcome > svg {
  color: #639a31;
}

.agenda-dock .progress-send:not(:disabled) {
  background: #29421e;
}

.progress-flyout {
  margin-bottom: 9px;
  overflow: hidden;
  border: 1px solid #d3d9cf;
  border-radius: 16px;
  background: rgba(253, 253, 250, 0.98);
  box-shadow: 0 18px 60px rgba(18, 27, 17, 0.14);
  animation: composer-rise 190ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

.progress-flyout header {
  justify-content: space-between;
  min-height: 48px;
  padding: 8px 12px 8px 14px;
  border-bottom: 1px solid #e4e8e0;
  background: #f4f6f1;
}

.progress-flyout header > div {
  display: grid;
  gap: 2px;
}

.progress-flyout header span {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 10px;
  font-weight: 700;
}

.progress-flyout header small {
  color: var(--muted);
  font-size: 8px;
}

.progress-flyout header button {
  display: grid;
  width: 30px;
  height: 30px;
  padding: 0;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
}

.progress-conversation {
  max-height: 640px;
  min-height: 132px;
  overflow-y: auto;
  padding: 18px;
}

.progress-history {
  display: grid;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px dashed #dfe5da;
}

.progress-history .progress-message.user p {
  color: #2f3a2b;
}

.progress-history small {
  color: var(--muted);
  font-size: 9px;
}

.progress-header-actions {
  display: flex;
  gap: 4px;
  align-items: center;
}

.goal-composer-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
  padding: 16px 18px 18px;
}

.goal-editor-field {
  display: grid;
  min-width: 0;
  gap: 7px;
}

.goal-editor-field > label {
  color: var(--ink);
  font-size: 11px;
  font-weight: 700;
}

.goal-editor-field > textarea {
  width: 100%;
  min-height: 92px;
  padding: 11px 12px;
  resize: vertical;
  border: 1px solid #d4dacd;
  border-radius: 11px;
  background: #fff;
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  line-height: 1.5;
}

.goal-editor-field > textarea:focus {
  border-color: #86bd58;
  outline: 3px solid rgba(168, 241, 91, 0.28);
}

.goal-editor-field > small {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.45;
}

.goal-composer-panel .composer-goal-suggestion {
  grid-column: 1;
  margin: 0;
}

.progress-message,
.progress-welcome {
  display: flex;
  gap: 9px;
  max-width: 86%;
  align-items: flex-start;
}

.progress-message p,
.progress-welcome p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  white-space: pre-line;
  text-wrap: pretty;
}

.progress-message strong,
.progress-welcome strong {
  font-size: 11px;
}

.progress-message.user {
  width: fit-content;
  margin: 0 0 14px auto;
  padding: 9px 12px;
  border-radius: 13px 13px 4px 13px;
  background: #e8f3dc;
}

.progress-message.user p {
  margin: 0;
  color: var(--ink);
}

.progress-message.assistant > svg,
.progress-welcome > svg {
  flex: 0 0 auto;
  margin-top: 1px;
  color: #60952f;
}

.progress-message .chat-markdown {
  min-width: 0;
}

.progress-message .chat-markdown p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.45;
  text-wrap: pretty;
}

.progress-message .chat-markdown p:first-child {
  margin-top: 4px;
}

.progress-message.user .chat-markdown p {
  margin: 0;
  color: var(--ink);
}

.progress-message .chat-markdown ul {
  margin: 6px 0 0;
  padding-left: 16px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.45;
}

.progress-message.user .chat-markdown ul {
  color: var(--ink);
}

.progress-message .chat-markdown li + li {
  margin-top: 3px;
}

.progress-message .chat-markdown strong {
  font-size: 10px;
}

.progress-message .chat-markdown .chat-markdown-heading {
  display: block;
  margin: 6px 0 2px;
  font-size: 10px;
}

/* Assistant replies read as body copy: ink, larger, medium weight. */
.progress-message.assistant .chat-markdown {
  color: var(--ink);
  font-size: 13px;
  font-weight: 550;
  line-height: 1.55;
}

.progress-message.assistant .chat-markdown p,
.progress-message.assistant .chat-markdown p:first-child {
  margin: 4px 0 0;
  color: var(--ink);
  font-size: 13px;
}

.progress-message.assistant .chat-markdown p:first-child { margin-top: 0; }

.progress-message.assistant .chat-markdown strong { font-size: 13px; }

.progress-message .chat-markdown code {
  padding: 1px 3px;
  border-radius: 4px;
  background: rgba(24, 32, 24, 0.08);
  font: 600 0.9em/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
}

.chat-error { display: grid; gap: 5px; margin: 8px 0; padding: 10px 12px; border: 1px solid #e3aaa2; border-radius: 10px; background: #fff6f4; color: #7c2d26; font-size: 10px; line-height: 1.45; }
.chat-error strong { font-size: 11px; }
.chat-error p { margin: 0; }
.chat-error button { justify-self: start; border: 0; border-radius: 8px; background: #7c2d26; color: #fff; font-size: 10px; font-weight: 700; padding: 6px 12px; cursor: pointer; }
.chat-error button:focus-visible { outline: 2px solid #7cc936; outline-offset: 2px; }

.progress-kind-options {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 11px;
}

.progress-kind-options button {
  min-height: 31px;
  padding: 0 10px;
  border: 1px solid #d4dacd;
  border-radius: 9px;
  background: #fff;
  color: #3f4c3b;
  font-size: 9px;
  font-weight: 650;
}

.progress-kind-options button:hover {
  border-color: #9ac971;
  background: #edf6e4;
}

.progress-input-shell {
  min-height: 58px;
  align-items: flex-end;
  padding: 8px 9px 8px 15px;
  border: 1px solid #cbd2c6;
  border-radius: 17px;
  background: rgba(255, 255, 253, 0.98);
  box-shadow: 0 9px 30px rgba(18, 27, 17, 0.11);
}

.progress-input-shell > svg {
  flex: 0 0 auto;
  margin-right: 10px;
  color: #6e786b;
}

.focus-dock-button {
  min-height: 36px;
  margin-right: 10px;
  padding: 0 10px;
  flex: 0 0 auto;
  border: 1px solid #d4dacd;
  border-radius: 10px;
  background: #f5f7f2;
  color: #42503e;
  font-size: 9px;
  font-weight: 700;
}

.focus-dock-button.active {
  border-color: #86bd58;
  background: #e6f5d7;
  color: #315f17;
}

.progress-input-shell textarea {
  min-width: 0;
  flex: 1 1 auto;
  min-height: 40px;
  max-height: 260px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  line-height: 1.35;
}

.progress-input-shell > span {
  margin: 0 9px;
  color: #8a9288;
  font-size: 8px;
  white-space: nowrap;
}

.progress-send {
  display: grid;
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  padding: 0;
  place-items: center;
  border: 0;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
}

.progress-send:disabled {
  background: #d9ded5;
  color: #8e978b;
}

.task-search-toolbar {
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.task-search {
  display: flex;
  min-width: 240px;
  min-height: 42px;
  flex: 1;
  align-items: center;
  padding: 0 9px 0 12px;
  border: 1px solid #d7ddd2;
  border-radius: 11px;
  background: #fff;
  color: #7d867a;
}

.task-search input {
  min-width: 0;
  flex: 1;
  margin-left: 8px;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 11px;
}

.task-search button {
  display: grid;
  width: 27px;
  height: 27px;
  padding: 0;
  place-items: center;
  border: 0;
  border-radius: 7px;
  background: transparent;
}

.card-title .task-filter-result {
  padding: 3px 7px;
  border-radius: 999px;
  background: #eef2ea;
  color: #687166;
  font-size: 8px;
  font-weight: 700;
}

@keyframes composer-rise {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.99);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

.page {
  width: min(100%, 1200px);
  max-width: none;
}

.day-grid,
.page {
  animation: view-enter 220ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

.page-intro {
  max-width: 700px;
  margin: 20px 0 22px;
}

.page-intro h2 {
  margin: 7px 0 8px;
  font-size: clamp(32px, 3.5vw, 42px);
  line-height: 1.04;
  letter-spacing: -0.045em;
}

.page-intro p {
  max-width: 650px;
  margin: 0;
  font-size: 13px;
  line-height: 1.55;
}

.panel {
  padding: 20px;
}

.tasks-heading,
.insights-heading {
  align-items: end;
}

.date-navigator,
.range-switch {
  margin-bottom: 22px;
}

.daily-goal-card {
  display: grid;
  grid-template-columns: minmax(190px, 0.3fr) minmax(0, 1fr);
  column-gap: 18px;
  align-items: start;
  margin-bottom: 14px;
}

.goal-card-head {
  align-items: start;
  margin: 2px 0 0;
}

.goal-card-head > div > span {
  font-size: 11px;
}

.daily-goal-card > textarea {
  grid-column: 2;
  grid-row: 1;
  min-height: 62px;
  padding: 11px 12px;
  background: #f2f4ef;
  font-size: 13px;
  font-weight: 500;
}

.daily-goal-card > p {
  grid-column: 2;
  grid-row: 1;
  margin: 4px 0;
  font-size: 15px;
}

.goal-suggestion,
.goal-independence {
  grid-column: 2;
}

.goal-suggestion {
  margin: 9px 0 0;
  padding: 10px 11px;
}

.goal-independence {
  margin-top: 8px;
  font-size: 10px;
}

/* Tasks heading: one line — title and date navigator on a shared baseline. */
.tasks-heading-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.tasks-heading-row h1 {
  margin: 0;
  font-size: 22px;
  letter-spacing: -0.02em;
}

.tasks-heading-row .date-navigator {
  margin-bottom: 0;
}

/* Agenda strip: focus statement, view chips with live counts, carry link. */
.task-agenda-strip {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 56px;
  margin-bottom: 12px;
  padding: 10px 14px;
}

.task-agenda-strip.historical {
  padding-block: 12px;
}

.agenda-strip-focus {
  display: flex;
  min-width: 0;
  flex: 1 1 320px;
  flex-direction: column;
  gap: 2px;
  text-align: left;
}

.agenda-strip-edit {
  display: inline-flex;
  min-width: 0;
  max-width: 100%;
  align-items: center;
  gap: 7px;
  padding: 2px 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
}

.agenda-strip-edit svg {
  flex: 0 0 auto;
  color: var(--muted);
}

.agenda-strip-edit:hover .agenda-strip-text {
  color: #40543a;
  text-decoration: underline;
  text-decoration-color: #91c568;
  text-underline-offset: 3px;
}

.agenda-strip-text {
  overflow: hidden;
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.agenda-strip-meta {
  padding-left: 20px;
  color: var(--muted);
  font-size: 9px;
}

.agenda-strip-chips {
  display: inline-flex;
  flex: 0 1 auto;
  flex-wrap: wrap;
  justify-content: flex-end;
  max-width: 100%;
  gap: 4px;
  padding: 3px;
  border: 1px solid #dde3d7;
  border-radius: 11px;
  background: #f4f6f0;
}

.agenda-strip-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #5b655a;
  font-size: 10px;
  font-weight: 720;
  white-space: nowrap;
}

.agenda-strip-chip em {
  min-width: 17px;
  padding: 1px 5px;
  border-radius: 999px;
  background: #e2e7dc;
  color: #54604f;
  font-size: 8.5px;
  font-style: normal;
  font-weight: 780;
  text-align: center;
}

.agenda-strip-chip:hover {
  background: #e9eee3;
}

.agenda-strip-chip.active {
  background: #29421e;
  color: #f2f7ec;
}

.agenda-strip-chip.active em {
  background: rgba(255, 255, 255, 0.16);
  color: #e4efdb;
}

.agenda-strip-carry {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 6px;
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid #e4cf9c;
  border-radius: 9px;
  background: #fff9e9;
  color: #6e4a10;
  font-size: 10px;
  font-weight: 720;
  white-space: nowrap;
}

.agenda-strip-carry:hover {
  background: #fff3d6;
}

/* Compact task rows: dot | body | actions | chevron. Grid anatomy lives in
   styles.css so the !important responsive overrides stay in one place. */
.task-state-dot {
  width: 9px;
  height: 9px;
  margin-top: 5px;
  border-radius: 50%;
  background: #b6c2ab;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8);
}

.task-state-dot.overdue { background: #c4453a; }
.task-state-dot.done { background: #7cba4d; }

.task-row-body {
  display: grid;
  min-width: 0;
  gap: 3px;
}

.task-row-line {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 8px;
}

/* Fixed-size inline furniture; the title takes the remaining width, and wraps
   onto its own furniture line on narrow rows rather than collapsing. */
.task-row-line.primary-line {
  flex-wrap: wrap;
}

.task-row-line.primary-line > * {
  flex: 0 0 auto;
}

.task-row-line.primary-line > h3 {
  flex: 1 1 auto;
  min-width: 96px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.task-row-line h3 {
  font-size: 13px;
  line-height: 1.35;
}

.task-due-chip {
  flex: 0 0 auto;
  padding: 2px 7px;
  border-radius: 999px;
  background: #eef2e8;
  color: #557d35;
  font-size: 9px;
  font-weight: 720;
  white-space: nowrap;
}

.task-due-chip.danger {
  background: #fbe9e7;
  color: #9b3f31;
}

.task-row-line.secondary-line {
  flex-wrap: wrap;
  gap: 4px 8px;
}

.task-row-line.secondary-line small {
  overflow: hidden;
  color: var(--muted);
  font-size: 9.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.task-row-desc {
  overflow: hidden;
  color: var(--muted);
  font-size: 10.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.workspace-task > svg:last-child {
  flex: 0 0 auto;
  margin-top: 4px;
  color: #a9b1a3;
}

/* Date-range filters live in a compact popover beside search. */
.task-filters-wrap {
  position: relative;
}

.task-filters-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 42px;
  padding: 0 14px;
  border: 1px solid #d8dcd2;
  border-radius: 11px;
  background: #fbfcf8;
  color: #4c5548;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.task-filters-toggle:hover,
.task-filters-toggle.active {
  border-color: #91c568;
  background: #f3f8ea;
}

.task-filters-popover {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 35;
  display: flex;
  align-items: end;
  gap: 8px;
  min-width: 300px;
  padding: 12px;
  border: 1px solid #d8dcd2;
  border-radius: 13px;
  background: #ffffff;
  box-shadow: 0 18px 40px rgba(18, 27, 17, 0.16);
}

.task-filters-popover label {
  display: grid;
  gap: 4px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 750;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.task-filters-popover input {
  height: 34px;
  padding: 0 8px;
  border: 1px solid #d8dcd2;
  border-radius: 8px;
  background: #fbfcf8;
  font-size: 11px;
}

.task-filters-popover > button {
  min-height: 34px;
  padding: 0 10px;
  font-size: 10px;
}

/* Empty states can offer the unfinished-work review directly. */
.task-empty {
  display: grid;
  justify-items: center;
  gap: 10px;
  padding: 18px 0 8px;
}

.task-empty-action {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid #e4cf9c;
  border-radius: 10px;
  background: #fff9e9;
  color: #6e4a10;
  font-size: 11px;
  font-weight: 720;
}

.task-empty-action:hover {
  background: #fff3d6;
}

.carry-alert {
  min-height: 54px;
  margin-bottom: 14px;
  padding: 11px 14px;
  border-color: #e4cf9c;
  background: #fff9e9;
}

.carry-alert strong,
.carry-alert small,
.carry-alert em {
  font-size: 10px;
}

.workspace-task {
  transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
}

.metric-grid {
  gap: 12px;
}

.metric {
  min-height: 126px;
  padding: 18px;
}

.primary,
.icon,
.avatar,
.provider,
.card-title button,
.date-navigator button,
.range-switch button {
  transition: background 150ms ease, border-color 150ms ease, color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
}

button:not(:disabled):active {
  transform: translateY(1px) scale(0.985);
}

.primary:not(:disabled):hover {
  border-color: #8bd248;
  background: #b4f76c;
  box-shadow: 0 6px 18px rgba(117, 187, 56, 0.18);
}

.meter i,
.completion-ring > span,
.trend-bars i,
.trend-bars b {
  transition: width 360ms cubic-bezier(0.2, 0.8, 0.2, 1), height 360ms cubic-bezier(0.2, 0.8, 0.2, 1), background 180ms ease;
}

@keyframes view-enter {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes companion-settle {
  from {
    opacity: 0;
    transform: translateY(9px) rotate(1.5deg) scale(0.97);
  }

  to {
    opacity: 0.96;
    transform: none;
  }
}

.metric small {
  font-size: 11px;
}

.metric strong {
  font-size: 25px;
}

.insight-brief,
.trend-panel,
.insight-drilldown {

}

.insight-brief h3 {

}

.insight-brief > div section {

}

.insight-brief section strong,
.insight-brief section p {

}

.trend-chart {
  height: 220px;
}

.insight-table-wrap table {

}
