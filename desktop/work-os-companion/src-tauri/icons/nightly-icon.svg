      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill-face" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7043CA"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

