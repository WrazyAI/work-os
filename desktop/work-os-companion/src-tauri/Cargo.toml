[package]
name = "work-os-companion"
version = "0.4.72"

description = "WrazyOS employee companion"
authors = ["Wrazy"]
edition = "2021"

[lib]
name = "work_os_companion_lib"
crate-type = ["rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
# Pinned to the 2.3 line: 2.4 requires tauri ^2.12, and upgrading the framework
# inside a feature change is a separate decision.
tauri-plugin-global-shortcut = "~2.3.2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-stronghold = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
rand = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
work-os-diagnostics-core = { path = "diagnostics-core" }
work-os-vault-password-core = { path = "vault-password-core" }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.2"
webview2-com = "0.38"
windows-sys = { version = "0.60", default-features = false, features = ["Win32_System_Threading"] }

[profile.dev.package.scrypt]
opt-level = 3
