[[permission]]
identifier = "allow-app-commands"
description = "Allow the main companion window to use local IPC commands."
commands.allow = [
  "get_vault_password",
  "reset_local_vault",
  "app_heartbeat",
  "ensure_local_settings",
  "notify_focus",
  "arm_update_exit_watchdog",
  "disarm_update_exit_watchdog",
  "open_work_os_auth",
  "worktivity_control",
  "finish_worktivity_control",
  "open_debug_window",
  "diagnostics_emit",
  "diagnostics_export",
  "open_logs_dir"
]
