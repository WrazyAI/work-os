name: Work OS payroll advance
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: work-os-payroll-advance
  cancel-in-progress: false
jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Advance due payroll runs
        env:
          WORK_OS_BASE_URL: ${{ secrets.WORK_OS_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 110 \
            -X POST "$WORK_OS_BASE_URL/api/work-os/admin/payroll/run-due" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"limit":2}'
