name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck (work-os)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run work-os:typecheck

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run work-os:test


  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/work-os-companion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/work-os-companion/package-lock.json

      - name: Install companion dependencies
        run: npm ci --no-audit --no-fund

      - name: Companion tests
        run: npm test

      - name: Companion typecheck and build
        run: npm run build

      # The local vault rules (one store access per launch, never minting over
      # an existing vault, creating the directories the Stronghold plugin writes
      # into, resetting a vault whose credential the OS refuses to remove) live
      # in a dependency-free Rust crate. They run here, where they are fast,
      # rather than only on a developer's machine.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Test the local vault rules
        run: cargo test --manifest-path src-tauri/vault-password-core/Cargo.toml

  release-policy:
    name: Windows release policy
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test PowerShell metadata and publication guards without secrets
        run: node --test test/work-os-release-policy.test.mjs
