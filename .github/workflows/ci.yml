name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck (work-os)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run work-os:typecheck

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run work-os:test


  companion:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: desktop/work-os-companion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/work-os-companion/package-lock.json

      - name: Install companion dependencies
        run: npm ci --no-audit --no-fund

      - name: Companion tests
        run: npm test

      - name: Companion typecheck and build
        run: npm run build

  release-policy:
    name: Windows release policy
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test PowerShell metadata and publication guards without secrets
        run: node --test test/work-os-release-policy.test.mjs
