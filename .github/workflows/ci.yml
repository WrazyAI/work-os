name: CI

on:
  push:
    branches: [main, codex/mascot-motion-ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck (work-os)
        run: npm run work-os:typecheck

      - name: Tests
        run: npm run work-os:test


  companion:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: desktop/work-os-companion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/work-os-companion/package-lock.json

      - name: Install companion dependencies
        run: npm ci --no-audit --no-fund

      - name: Companion tests
        run: npm test

      - name: Companion typecheck and build
        run: npm run build

  mascot-browser:
    if: github.ref == 'refs/heads/codex/mascot-motion-ci'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install companion dependencies
        working-directory: desktop/work-os-companion
        run: npm ci --no-audit --no-fund

      - name: Install browser runtime
        run: |
          npm install --prefix /tmp/otto-browser playwright --no-audit --no-fund
          /tmp/otto-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Start companion preview
        working-directory: desktop/work-os-companion
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/otto-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/otto-vite.log
          exit 1

      - name: Verify mascot state, motion and layout
        env:
          NODE_PATH: /tmp/otto-browser/node_modules
        run: node scripts/verify-mascot-sync.cjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mascot-motion-evidence
          path: |
            /tmp/otto-orb.png
            /tmp/otto-dashboard.png
            /tmp/otto-active.png
            /tmp/otto-debugger.png
          if-no-files-found: warn
