name: Work OS Companion macOS build

# Nightly at 20:50 UTC (8:50 pm GMT) against the latest main — the build that
# was last deployed — instead of on every companion pull request: macOS minutes
# are the most expensive runner minutes, and the packaged-app startup gate only
# needs to catch regressions in what actually ships. Dispatch it by hand when a
# change needs Mac validation before merge.
on:
  schedule:
    - cron: "50 20 * * *"
  workflow_dispatch:
    inputs:
      geometry_release:
        description: "Audit a published release's native window bounds only (optional release tag)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: companion-macos-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-geometry-audit:
    if: ${{ inputs.geometry_release != '' && inputs.geometry_release != null }}
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the published Mac app under investigation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.geometry_release }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Work-OS-Companion-macOS-Universal-UNSIGNED.app.tar.gz' --dir "$RUNNER_TEMP/mac-app"
          tar -xzf "$RUNNER_TEMP/mac-app/Work-OS-Companion-macOS-Universal-UNSIGNED.app.tar.gz" -C "$RUNNER_TEMP/mac-app"
      - name: Check real native bounds on a compact display
        working-directory: desktop/work-os-companion
        run: bash scripts/check-macos-window-bounds.sh "$RUNNER_TEMP/mac-app/Work OS Companion.app/Contents/MacOS/work-os-companion"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build the isolated layout fixture with production CSS
        working-directory: desktop/work-os-companion
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-native-layout-fixture.mjs
      - name: Render the production layout in the real macOS webview
        working-directory: desktop/work-os-companion
        run: |
          python3 -m http.server 1437 --bind 127.0.0.1 --directory native-layout-dist > "$RUNNER_TEMP/native-window-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          xcrun swiftc scripts/check-native-webview-layout.swift -o "$RUNNER_TEMP/native-window-webview-probe"
          "$RUNNER_TEMP/native-window-webview-probe" | tee "$RUNNER_TEMP/native-window-webview.json"
          LAYOUT_WIDTH=720 LAYOUT_HEIGHT=600 "$RUNNER_TEMP/native-window-webview-probe" | tee "$RUNNER_TEMP/native-window-webview-720.json"
      - name: Retain native window evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-native-geometry-${{ github.run_id }}
          path: ${{ runner.temp }}/native-window-*
          retention-days: 7
  macos:
    if: ${{ !inputs.geometry_release }}
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop/work-os-companion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/work-os-companion/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/work-os-companion/src-tauri -> target
          shared-key: work-os-companion-macos-universal-check
      - run: npm ci --no-audit --no-fund
      - name: Test release safety and startup failure paths
        run: node --test ../../test/work-os-macos-release.test.mjs
      - run: npm test
      - name: Clear cached installer outputs
        run: rm -rf src-tauri/target/universal-apple-darwin/release/bundle
      - name: Build Mac packages without release credentials
        run: npm run tauri:build:macos -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify Intel and Apple Silicon executable
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Work OS Companion.app"
          lipo "$app/Contents/MacOS/work-os-companion" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
      - name: Check packaged Mac app starts
        run: bash scripts/check-macos-startup.sh
      - name: Upload Mac startup diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-check-startup-${{ github.run_id }}
          path: ${{ runner.temp }}/companion-startup.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Mac installer for testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-os-companion-macos-universal-internal
          path: desktop/work-os-companion/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
