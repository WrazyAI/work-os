name: Mascot integration workbench
on:
  push:
    branches: [codex/mascot-sync-workbench]
    paths: [.github/workflows/mascot-sync-workbench.yml]
permissions:
  contents: write
jobs:
  visual-review:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private review thumbnails
        run: |
          python3 -m pip install --target /tmp/otto-pil pillow --quiet
          PYTHONPATH=/tmp/otto-pil python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import io, base64
          root=Path('mascot-sync-workbench/evidence')
          for name in ['otto-dashboard','otto-active','otto-debugger']:
            image=Image.open(root/(name+'.png')).convert('RGB')
            image.thumbnail((320,320))
            buffer=io.BytesIO()
            image.save(buffer,format='JPEG',quality=15,optimize=True)
            encoded=base64.b64encode(buffer.getvalue()).decode()
            (root/(name+'-mini.b64')).write_text(encoded+'\n')
            print(name, image.size, len(encoded))
          PY
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add mascot-sync-workbench/evidence/*-mini.b64
          git commit -m 'test: save transport-sized screenshot evidence'
          git push origin HEAD:refs/heads/codex/mascot-sync-workbench
