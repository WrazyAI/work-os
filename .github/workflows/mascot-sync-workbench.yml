name: Mascot integration workbench
on:
  push:
    branches: [codex/mascot-sync-workbench]
    paths: [.github/workflows/mascot-sync-workbench.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect integration seams (no runtime or user data)
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path('desktop/work-os-companion/src')
          targets = {
            'App.tsx': r'const visibleSession|const gate|debug-scenario|debug-request|debugRef.current =|setProgressReceipt|notifications.success|leavingTaskIds|return <div className="workspace',
            'AvatarApp.tsx': r'const lastEntry|readyPulse|const agentActivity|const workdayState|const mascotVisual|catch \(|setError|receipt:|niftySyncError|<MascotPet',
            'types.ts': r'interface DebugScenario|type DebugDayState|interface DesktopSession',
            'dashboard-overhaul.css': r'dashboard-otto|dashboard-art-orbit|active-status-heading',
            'debug-main.tsx': r'.',
          }
          for filename, pattern in targets.items():
            file = root / filename
            if not file.exists(): continue
            lines = file.read_text().splitlines()
            indexes = set()
            for i, line in enumerate(lines):
              if re.search(pattern,line):
                indexes.update(range(max(0,i-2),min(len(lines),i+10)))
            print('\nFILE', filename, 'LINES',len(lines))
            for i in sorted(indexes): print(str(i+1)+': '+lines[i])
          PY
