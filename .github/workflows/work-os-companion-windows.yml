name: Work OS Companion Windows Release

on:
  push:
    tags:
      - "work-os-companion-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer from tauri.conf.json, for example 0.2.1"
        required: true
        type: string
      release_channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - pilot
      publish_release:
        description: "Publish after validation (otherwise leave a draft)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: work-os-companion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-windows-release:
    name: Build and verify signed Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    environment: windows-production-release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/work-os-companion
    env:
      VITE_WORK_OS_API_URL: https://app.wrazyos.com
      VITE_WORK_OS_UPDATE_ORIGIN: https://app.wrazyos.com

    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/work-os-companion/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Resolve and validate release metadata
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_CHANNEL: ${{ inputs.release_channel }}
          DISPATCH_PUBLISH: ${{ inputs.publish_release }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagPrefix = "work-os-companion-v"

          if ("${{ github.event_name }}" -eq "push") {
            if (-not "${{ github.ref }}".StartsWith("refs/tags/$tagPrefix")) {
              throw "Tag releases must use $tagPrefix<semver>"
            }
            $version = "${{ github.ref_name }}".Substring($tagPrefix.Length)
            $channel = "stable"
            $publish = "true"
            $tag = "${{ github.ref_name }}"
          } else {
            $version = $env:DISPATCH_VERSION.Trim()
            $channel = $env:DISPATCH_CHANNEL
            $publish = $env:DISPATCH_PUBLISH.ToLowerInvariant()
            $tag = "$tagPrefix$version"
            if ($publish -eq "true" -and "${{ github.ref }}" -ne "refs/heads/main") {
              throw "Manual publication is restricted to the main branch"
            }
          }

          $semver = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          if ($version -notmatch $semver) { throw "Release version is not valid SemVer: $version" }
          if ($channel -eq "stable" -and $version -match '[-+]') {
            throw "Stable releases require a plain major.minor.patch version"
          }
          if ($channel -eq "pilot" -and $version -notmatch '-') {
            throw "Pilot releases require a SemVer prerelease suffix, for example 0.2.2-pilot.1"
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargoText = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargoText -notmatch '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"') {
            throw "Could not read the Cargo package version"
          }
          $cargoVersion = $Matches[1]
          foreach ($entry in @{
            "tauri.conf.json" = $tauriVersion
            "package.json" = $packageVersion
            "Cargo.toml" = $cargoVersion
          }.GetEnumerator()) {
            if ($entry.Value -ne $version) {
              throw "$($entry.Key) version $($entry.Value) does not match release version $version"
            }
          }

          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "channel=$channel" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish=$publish" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Require production release credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PRIVATE_KEY)) { $missing += "TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PRIVATE_KEY_PASSWORD)) { $missing += "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) { $missing += "WINDOWS_CERTIFICATE_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) { $missing += "WINDOWS_CERTIFICATE_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PUBLIC_KEY)) { $missing += "TAURI_UPDATER_PUBLIC_KEY" }
          if ($missing.Count -gt 0) {
            throw "Signed releases fail closed. Missing GitHub Actions secrets: $($missing -join ', ')"
          }
          $configuredPublicKey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if ($env:UPDATER_PUBLIC_KEY.Trim() -ne $configuredPublicKey.Trim()) {
            throw "TAURI_UPDATER_PUBLIC_KEY does not match the public key committed in tauri.conf.json"
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned CI-only Node typings
        run: npm install --no-save --ignore-scripts --package-lock=false @types/node@22.18.3

      - name: Test packaged frontend
        run: |
          npm test
          npm run build

      - name: Import Authenticode certificate and configure Tauri
        id: certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "work-os-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          } catch {
            throw "WINDOWS_CERTIFICATE_BASE64 is not a valid base64-encoded PFX"
          }

          $secure = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          if (-not $cert -or -not $cert.HasPrivateKey) { throw "The imported certificate has no private key" }
          if ($cert.NotAfter -le (Get-Date).ToUniversalTime()) { throw "The code-signing certificate is expired" }
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          if (-not ($cert.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningOid)) {
            throw "The imported certificate is not valid for code signing"
          }

          $config = @{
            version = "${{ steps.release.outputs.version }}"
            build = @{ beforeBuildCommand = "" }
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
            plugins = @{ updater = @{ pubkey = $env:UPDATER_PUBLIC_KEY } }
          } | ConvertTo-Json -Depth 8 -Compress
          "TAURI_CONFIG=$config" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "thumbprint=$($cert.Thumbprint)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build signed MSI, NSIS, and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Stage and verify release assets
        id: assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Resolve-Path "src-tauri/target/release/bundle"
          $releaseExe = Resolve-Path "src-tauri/target/release/work-os-companion.exe"
          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter "*.exe")
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter "*.msi")
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($nsis.Count)" }
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI installer, found $($msi.Count)" }

          $nsisSig = Get-Item "$($nsis[0].FullName).sig" -ErrorAction Stop
          $msiSig = Get-Item "$($msi[0].FullName).sig" -ErrorAction Stop
          foreach ($file in @($releaseExe.Path, $nsis[0].FullName, $msi[0].FullName)) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne "Valid") {
              throw "Authenticode verification failed for $file`: $($signature.Status)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:CERTIFICATE_THUMBPRINT) {
              throw "Unexpected signing certificate on $file"
            }
          }

          $stage = Join-Path $env:RUNNER_TEMP "work-os-release"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $nsis[0].FullName "$stage/Work-OS-Companion-Setup.exe"
          Copy-Item $nsisSig.FullName "$stage/Work-OS-Companion-Setup.exe.sig"
          Copy-Item $msi[0].FullName "$stage/Work-OS-Companion.msi"
          Copy-Item $msiSig.FullName "$stage/Work-OS-Companion.msi.sig"

          $portableDir = Join-Path $env:RUNNER_TEMP "work-os-portable"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item $releaseExe.Path "$portableDir/Work-OS-Companion.exe"
          Compress-Archive -Path "$portableDir/Work-OS-Companion.exe" -DestinationPath "$stage/Work-OS-Companion-Portable.zip"

          $updaterSignature = (Get-Content $nsisSig.FullName -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($updaterSignature)) { throw "The NSIS updater signature is empty" }
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/Work-OS-Companion-Setup.exe"
          $manifest = @{
            version = $env:RELEASE_VERSION
            notes = "Work OS Companion $env:RELEASE_VERSION"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{ url = $assetUrl; signature = $updaterSignature }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content "$stage/latest.json" -Encoding utf8

          $checksumTargets = @(
            "Work-OS-Companion-Setup.exe",
            "Work-OS-Companion-Setup.exe.sig",
            "Work-OS-Companion.msi",
            "Work-OS-Companion.msi.sig",
            "Work-OS-Companion-Portable.zip",
            "latest.json"
          )
          $checksumLines = foreach ($name in $checksumTargets) {
            $hash = (Get-FileHash "$stage/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksumLines | Set-Content "$stage/SHA256SUMS.txt" -Encoding ascii

          $zipList = tar -tf "$stage/Work-OS-Companion-Portable.zip"
          if ($LASTEXITCODE -ne 0 -or $zipList -notcontains "Work-OS-Companion.exe") {
            throw "Portable archive validation failed"
          }
          $parsedManifest = Get-Content "$stage/latest.json" -Raw | ConvertFrom-Json
          if ($parsedManifest.version -ne $env:RELEASE_VERSION -or
              [string]::IsNullOrWhiteSpace($parsedManifest.platforms.'windows-x86_64'.signature)) {
            throw "Updater manifest validation failed"
          }

          "stage=$stage" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-os-companion-${{ steps.release.outputs.version }}-signed
          path: ${{ steps.assets.outputs.stage }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_STAGE: ${{ steps.assets.outputs.stage }}
        run: |
          $ErrorActionPreference = "Stop"
          $existingJson = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo "${{ github.repository }}" --target "${{ github.sha }}" --draft --title "Work OS Companion $env:RELEASE_VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $env:RELEASE_TAG" }
          } else {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.draft) { throw "Release $env:RELEASE_TAG is already published and cannot be overwritten" }
            $tagCommit = gh api "repos/${{ github.repository }}/commits/$env:RELEASE_TAG" --jq '.sha'
            if ($tagCommit -ne "${{ github.sha }}") { throw "Existing release tag points to a different commit" }
          }

          $assets = Get-ChildItem $env:RELEASE_STAGE -File | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG $assets --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed" }

          $required = @(
            "Work-OS-Companion-Setup.exe",
            "Work-OS-Companion-Setup.exe.sig",
            "Work-OS-Companion.msi",
            "Work-OS-Companion.msi.sig",
            "Work-OS-Companion-Portable.zip",
            "latest.json",
            "SHA256SUMS.txt"
          )
          $uploaded = @(gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          $missing = @($required | Where-Object { $_ -notin $uploaded })
          if ($missing.Count -gt 0) { throw "Release is missing assets: $($missing -join ', ')" }

      - name: Publish verified release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          if ($env:RELEASE_CHANNEL -eq "stable") {
            gh release edit $env:RELEASE_TAG --repo "${{ github.repository }}" --draft=false --prerelease=false --latest
          } else {
            gh release edit $env:RELEASE_TAG --repo "${{ github.repository }}" --draft=false --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }

      - name: Remove imported certificate
        if: always()
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_THUMBPRINT)) {
            Remove-Item "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP "work-os-signing.pfx") -Force -ErrorAction SilentlyContinue
