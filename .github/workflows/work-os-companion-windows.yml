name: Work OS Companion Windows Internal Release

on:
  push:
    branches: [main]
    tags: ["work-os-companion-internal-v*"]
    paths:
      - "desktop/work-os-companion/package.json"
      - "desktop/work-os-companion/src-tauri/Cargo.toml"
      - "desktop/work-os-companion/src-tauri/tauri.conf.json"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer from tauri.conf.json, for example 0.2.2"
        required: true
        type: string
      publish_internal_release:
        description: "Publish as an explicitly unsigned prerelease (otherwise leave a draft)"
        required: true
        default: false
        type: boolean
      unsigned_acknowledgement:
        description: "When publishing, enter exactly: UNSIGNED INTERNAL"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: work-os-companion-internal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-windows-release:
    name: Build unsigned Windows packages with signed updater artifacts
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 60
    environment: windows-production-release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/work-os-companion
    env:
      VITE_WORK_OS_API_URL: https://app.wrazyos.com
      VITE_WORK_OS_UPDATE_ORIGIN: https://app.wrazyos.com

    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/work-os-companion/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Resolve and validate release metadata
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish_internal_release }}
          DISPATCH_ACKNOWLEDGEMENT: ${{ inputs.unsigned_acknowledgement }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagPrefix = "work-os-companion-internal-v"
          if ("${{ github.event_name }}" -eq "push") {
            if ("${{ github.ref }}".StartsWith("refs/tags/$tagPrefix")) {
              $version = "${{ github.ref_name }}".Substring($tagPrefix.Length)
              $publish = "false"
              $tag = "${{ github.ref_name }}"
            } elseif ("${{ github.ref }}" -eq "refs/heads/main") {
              $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
              $publish = "true"
              $tag = "$tagPrefix$version"
            } else {
              throw "Internal releases must originate from main or a $tagPrefix<semver> tag"
            }
          } else {
            $version = $env:DISPATCH_VERSION.Trim()
            $publish = $env:DISPATCH_PUBLISH.ToLowerInvariant()
            $tag = "$tagPrefix$version"
            if ($publish -eq "true") {
              if ("${{ github.ref }}" -ne "refs/heads/main") { throw "Internal release publication is restricted to the main branch" }
              if ($env:DISPATCH_ACKNOWLEDGEMENT -cne "UNSIGNED INTERNAL") { throw "Publishing requires the exact acknowledgement: UNSIGNED INTERNAL" }
            }
          }

          $semver = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          if ($version -notmatch $semver) { throw "Release version is not valid SemVer: $version" }
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargoText = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargoText -notmatch '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"') { throw "Could not read the Cargo package version" }
          $cargoVersion = $Matches[1]
          foreach ($entry in @{ "tauri.conf.json" = $tauriVersion; "package.json" = $packageVersion; "Cargo.toml" = $cargoVersion }.GetEnumerator()) {
            if ($entry.Value -ne $version) { throw "$($entry.Key) version $($entry.Value) does not match release version $version" }
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish=$publish" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Require updater signing credentials
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PRIVATE_KEY)) { $missing += "TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PRIVATE_KEY_PASSWORD)) { $missing += "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PUBLIC_KEY)) { $missing += "TAURI_UPDATER_PUBLIC_KEY" }
          if ($missing.Count -gt 0) { throw "Updater-signed releases fail closed. Missing GitHub environment secrets: $($missing -join ', ')" }
          $configuredPublicKey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if ($env:UPDATER_PUBLIC_KEY.Trim() -ne $configuredPublicKey.Trim()) { throw "TAURI_UPDATER_PUBLIC_KEY does not match the public key committed in tauri.conf.json" }

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned CI-only Node typings
        run: npm install --no-save --ignore-scripts --package-lock=false @types/node@22.18.3

      - name: Test packaged frontend
        run: |
          npm test
          npm run build

      - name: Build unsigned MSI, NSIS, and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Stage and verify explicitly unsigned assets
        id: assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Resolve-Path "src-tauri/target/release/bundle"
          $releaseExe = Resolve-Path "src-tauri/target/release/work-os-companion.exe"
          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter "*.exe")
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter "*.msi")
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($nsis.Count)" }
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI installer, found $($msi.Count)" }
          $nsisSig = Get-Item "$($nsis[0].FullName).sig" -ErrorAction Stop
          $msiSig = Get-Item "$($msi[0].FullName).sig" -ErrorAction Stop
          foreach ($file in @($releaseExe.Path, $nsis[0].FullName, $msi[0].FullName)) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne "NotSigned") { throw "Free/internal builds must be explicitly unsigned; unexpected Authenticode status for $file`: $($signature.Status)" }
          }
          foreach ($signatureFile in @($nsisSig.FullName, $msiSig.FullName)) {
            if ([string]::IsNullOrWhiteSpace((Get-Content $signatureFile -Raw))) { throw "Updater signature is empty: $signatureFile" }
          }

          $stage = Join-Path $env:RUNNER_TEMP "work-os-release"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $nsis[0].FullName "$stage/Work-OS-Companion-Setup-UNSIGNED.exe"
          Copy-Item $nsisSig.FullName "$stage/Work-OS-Companion-Setup-UNSIGNED.exe.sig"
          Copy-Item $msi[0].FullName "$stage/Work-OS-Companion-UNSIGNED.msi"
          Copy-Item $msiSig.FullName "$stage/Work-OS-Companion-UNSIGNED.msi.sig"
          $portableDir = Join-Path $env:RUNNER_TEMP "work-os-portable"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item $releaseExe.Path "$portableDir/Work-OS-Companion-UNSIGNED.exe"
          Compress-Archive -Path "$portableDir/Work-OS-Companion-UNSIGNED.exe" -DestinationPath "$stage/Work-OS-Companion-Portable-UNSIGNED.zip"

          $updaterSignature = (Get-Content $nsisSig.FullName -Raw).Trim()
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/Work-OS-Companion-Setup-UNSIGNED.exe"
          $manifest = @{
            version = $env:RELEASE_VERSION
            notes = "UNSIGNED INTERNAL Work OS Companion $env:RELEASE_VERSION. The updater artifact is cryptographically signed, but the Windows executable is not Authenticode-signed."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{ "windows-x86_64" = @{ url = $assetUrl; signature = $updaterSignature } }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content "$stage/latest-internal.json" -Encoding utf8
          $checksumTargets = @("Work-OS-Companion-Setup-UNSIGNED.exe", "Work-OS-Companion-Setup-UNSIGNED.exe.sig", "Work-OS-Companion-UNSIGNED.msi", "Work-OS-Companion-UNSIGNED.msi.sig", "Work-OS-Companion-Portable-UNSIGNED.zip", "latest-internal.json")
          $checksumLines = foreach ($name in $checksumTargets) {
            $hash = (Get-FileHash "$stage/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllText(
            "$stage/SHA256SUMS.txt",
            (($checksumLines -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false)
          )

          $zipList = tar -tf "$stage/Work-OS-Companion-Portable-UNSIGNED.zip"
          if ($LASTEXITCODE -ne 0 -or $zipList -notcontains "Work-OS-Companion-UNSIGNED.exe") { throw "Portable archive validation failed" }
          $parsedManifest = Get-Content "$stage/latest-internal.json" -Raw | ConvertFrom-Json
          if ($parsedManifest.version -ne $env:RELEASE_VERSION -or [string]::IsNullOrWhiteSpace($parsedManifest.platforms.'windows-x86_64'.signature) -or $parsedManifest.platforms.'windows-x86_64'.url -notmatch 'UNSIGNED\.exe$') { throw "Updater manifest validation failed" }
          "stage=$stage" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload verified internal workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-os-companion-${{ steps.release.outputs.version }}-unsigned-internal
          path: ${{ steps.assets.outputs.stage }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create or update draft internal GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_STAGE: ${{ steps.assets.outputs.stage }}
        run: |
          $ErrorActionPreference = "Stop"
          $title = "UNSIGNED INTERNAL - Work OS Companion $env:RELEASE_VERSION"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          ## Unsigned internal build

          This free-distribution build is **not Authenticode-signed**. Windows SmartScreen may warn during installation. It is restricted to approved employee testing and must not be represented as a trusted Windows release.

          The attached Tauri updater artifacts are signed. Verify browser downloads against `SHA256SUMS.txt` before running them.
          "@ | Set-Content $notesPath -Encoding utf8

          $existingJson = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo "${{ github.repository }}" --target "${{ github.sha }}" --draft --prerelease --title $title --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $env:RELEASE_TAG" }
          } else {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.draft) { throw "Release $env:RELEASE_TAG is already published and cannot be overwritten" }
            $tagCommit = gh api "repos/${{ github.repository }}/commits/$env:RELEASE_TAG" --jq '.sha'
            if ($tagCommit -ne "${{ github.sha }}") { throw "Existing release tag points to a different commit" }
            gh release edit $env:RELEASE_TAG --repo "${{ github.repository }}" --title $title --notes-file $notesPath --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not refresh draft release metadata" }
          }
          $assets = Get-ChildItem $env:RELEASE_STAGE -File | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG $assets --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed" }
          $required = @("Work-OS-Companion-Setup-UNSIGNED.exe", "Work-OS-Companion-Setup-UNSIGNED.exe.sig", "Work-OS-Companion-UNSIGNED.msi", "Work-OS-Companion-UNSIGNED.msi.sig", "Work-OS-Companion-Portable-UNSIGNED.zip", "latest-internal.json", "SHA256SUMS.txt")
          $uploaded = @(gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          $missing = @($required | Where-Object { $_ -notin $uploaded })
          if ($missing.Count -gt 0) { throw "Release is missing assets: $($missing -join ', ')" }

      - name: Publish explicitly unsigned internal prerelease
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release edit $env:RELEASE_TAG --repo "${{ github.repository }}" --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Internal prerelease publication failed" }
